    this.timer = setInterval(() => {
      const now = performance.now();
      const dt = Math.min(1, (now - last) / 1000);
      last = now;
      this.tick(dt);
    }, 100);
  }
  stop() { clearInterval(this.timer); this.timer = null; Sound.stopAllLoops(); Voice.stop(); this.save(); }

  tick(dt) {
    if (this.showEnding) return;
    const now = Date.now(), k = this.clocks;
    this.updateFest(now);
    this.earn(this.basePerSecond * dt);
    if (this.owns('notifications') && (k.notif -= dt) <= 0) {
      k.notif = Math.max(1.5, rand(4, 9) / (1 + 0.3 * (this.level('notifications') - 1)));
      this.pushNotification();
    }
    if (this.owns('stocks') && (k.stock += dt) >= 0.5) { k.stock = 0; this.stepStock(); }
    if (this.danmaku.length && now - this.danmaku[0].born > 8000) this.danmaku = this.danmaku.filter(d => now - d.born <= 8000);
    if (this.owns('danmaku') && (k.danmaku -= dt) <= 0) {
      k.danmaku = rand(0.8, 1.8) / Math.min(this.level('danmaku'), 6);
      this.spawnDanmaku(1);
    }
    if (this.owns('superChat') && (k.superChat -= dt) <= 0) {
      k.superChat = Math.max(2.5, rand(8, 15) / (1 + 0.3 * (this.level('superChat') - 1)));
      this.pushSuperChat();
    }
    if (this.owns('pet')) this.tickPet(dt);
    if (this.owns('studyBird')) this.tickBird(dt);
    if ((k.fish += dt) >= 1) { this.tickFish(k.fish); k.fish = 0; }
    if (this.lastCell && (k.heartbeat -= dt) <= 0) { k.heartbeat = 0.75; Haptics.light(); }
    if ((k.save += dt) >= 5) this.save();
    this.v && this.v.tick();
  }

  earn(amount, boosted = true) {
    if (!(amount > 0)) return 0;
    const v = boosted ? amount * this.earnMultiplier : amount;
    this.stim += v; this.totalEarned += v; this.lifetimeEarned += v;
    if (this.lifetimeEarned >= 1e6) this.unlock('million');
    return v;
  }
  popup(text, kind, row, col) { this.v && this.v.popup(text, kind, row == null ? Math.floor(this.board.rows / 2) : row, col == null ? Math.floor(this.board.cols / 2) : col); }
  shake() { this.v && this.v.shake(); }
  refresh() { this.v && this.v.render(); }

  // ----- ショップ -----
  price(id) { return itemPrice(ITEM[id], this.level(id)); }
  isMaxed(id) { return this.level(id) >= ITEM[id].maxLevel; }
  canBuy(id) { return !this.isMaxed(id) && this.stim >= this.price(id); }
  isRevealed(id) { return id === 'tapPower' || id === 'dvd' || this.owns(id) || this.totalEarned >= ITEM[id].basePrice * 0.4; }
  bulkQuote(id, quantity) {
    const it = ITEM[id], cur = this.level(id), remaining = it.maxLevel - cur;
    if (remaining <= 0) return { count: 0, cost: 0 };
    if (quantity != null) {
      const n = Math.min(quantity, remaining); let cost = 0;
      for (let k = 0; k < n; k++) cost += itemPrice(it, cur + k);
      return { count: n, cost };
    }
    let n = 0, cost = 0;
    while (n < Math.min(remaining, 1000)) {
      const next = itemPrice(it, cur + n);
      if (cost + next > this.stim) break;
      cost += next; n++;
    }
    return n === 0 ? { count: 1, cost: itemPrice(it, cur) } : { count: n, cost };
  }
  canBuyQ(id, quantity) { const q = this.bulkQuote(id, quantity); return q.count > 0 && this.stim >= q.cost; }
  buy(id, quantity = 1) {
    const q = this.bulkQuote(id, quantity);
    if (!(q.count > 0 && this.stim >= q.cost) || this.showEnding) { Haptics.warning(); return; }
    this.stim -= q.cost;
    const wasOwned = this.owns(id);
    this.levels[id] = this.level(id) + q.count;
    Sound.play('buy'); Haptics.success();
    if (id === 'detox') { this.unlock('ending'); this.triggerEnding(); }
    else {
      this.applyAmbience();
      this.popup(`${ITEM[id].name}${q.count > 1 ? ' ×' + q.count : ''} GET!`, 'info');
      if (id === 'pet') this.petHunger = 1;
      if ((id === 'lucky' || id === 'slot') && this.phase === 'playing' && !wasOwned) this.assignSpecialCells();
    }
    if (ITEMS.filter(i => i.id !== 'tapPower' && i.id !== 'detox').every(i => this.owns(i.id))) this.unlock('allItems');
    this.save(); this.refresh();
  }
  applyAmbience() {
    const on = !this.showEnding;
    Sound.setLoop('lofi', on && this.level('lofi') === 1);
    Sound.setLoop('lofiPlus', on && this.level('lofi') >= 2);
    Sound.setLoop('rain', on && this.owns('rain'));
    Sound.setLoop('heartbeat', on && this.lastCell);
  }

  // ----- 入力 -----
  tap(i) {
    if (!this.isActive || this.isBlocked) return;
    const cell = this.board.cells[i];
    if (this.flagMode && !cell.isOpen) return this.toggleFlag(i);
    if (cell.isFlagged) return Haptics.light();
    if (cell.isOpen) return this.chord(i);
    const first = this.phase === 'ready';
    if (first) { this.board.placeMines(i); this.phase = 'playing'; }
    this.reveal([i], i, false);
    if (first && this.phase === 'playing') this.assignSpecialCells();
    this.refresh();
  }
  longPress(i) {
    if (!this.isActive || this.isBlocked) return;
    if (this.board.cells[i].isOpen) this.chord(i); else this.toggleFlag(i);
  }
  toggleFlagMode() { this.flagMode = !this.flagMode; Haptics.light(); Sound.play('button'); this.refresh(); }
  toggleFlag(i) { if (this.board.toggleFlag(i)) { Haptics.medium(); Sound.play('flag'); this.refresh(); } }
  chord(i) {
    const t = this.board.chordTargets(i);
    if (!t.length) return Haptics.light();
    this.reveal(t, i, false); this.refresh();
  }
  reveal(targets, origin, auto) {
    const mine = targets.find(t => this.board.cells[t].isMine && !this.board.cells[t].isFlagged);
    if (mine != null) return this.explode(mine);
    let opened = [];
    for (const t of targets) opened = opened.concat(this.board.open(t));
    if (!opened.length) return;
    this.registerOpen(opened, origin, auto);
    if (this.board.safeRemaining === 0) this.win();
  }
  assignSpecialCells() {
    const cand = this.board.cells.filter(c => !c.isOpen && !c.isMine).map(c => c.id).sort(() => Math.random() - 0.5);
    if (this.owns('lucky')) {
      let n = Math.min(this.level('lucky'), 4) + (Math.random() < 0.3 ? 1 : 0);
      while (n-- > 0 && cand.length) this.luckyCells.add(cand.pop());
    }
    if (this.owns('slot')) {
      let n = Math.min(this.level('slot'), 3);
      while (n-- > 0 && cand.length) this.slotCells.add(cand.pop());
    }
  }
  openOneSafeCell() {
    if (this.phase !== 'playing') return;
    const cand = this.board.cells.filter(c => !c.isOpen && !c.isMine && !c.isFlagged).map(c => c.id);
    const frontier = cand.filter(i => this.board.neighbors(i).some(n => this.board.cells[n].isOpen));
    const list = frontier.length ? frontier : cand;
    if (!list.length) return;
    const t = pick(list);
    this.reveal([t], t, true);
    this.refresh();
  }
  registerOpen(opened, origin, auto) {
    const count = opened.length;
    this.cellsOpened += count;
    this.growFish(count);
    if (!auto) {
      this.combo++;
      const token = ++this.comboToken;
      setTimeout(() => { if (this.comboToken === token) { this.combo = 0; this.refresh(); } }, 2000);
      if (this.combo >= 20) this.unlock('combo20');
    }
    let gained = count * this.cellValue * this.comboMultiplier * this.streakMultiplier;
    if (count >= 10) gained *= 2;
    const r = this.board.row(origin), c = this.board.col(origin);
    const ids = new Set(opened.map(o => o.index));
    const luckyHit = [...this.luckyCells].filter(i => ids.has(i));
    if (luckyHit.length) {
      luckyHit.forEach(i => this.luckyCells.delete(i));
      gained *= 10;
      this.popup('LUCKY ×10!!', 'fever', Math.max(r - 1, 0), c);
      Sound.play('ssr'); Haptics.success();
      this.spawnDanmaku(5, ['金！！', 'ラッキー！', 'うらやま', '金色きた', '888888']);
      this.unlock('lucky');
      if (this.bump('lucky') >= 10) this.unlock('lucky10');
      if (Math.random() < 0.3) this.dropEgg('ラッキー');
      this.shout(['きんいろー！', 'ラッキー！'], true);
    }
    const earned = this.earn(gained);
    this.freshDepth = new Map(opened.map(o => [o.index, o.depth]));
    const ft = ++this.freshToken;
    setTimeout(() => { if (this.freshToken === ft) { this.freshDepth = new Map(); this.refresh(); } }, 900);
    this.refresh();
    this.popup('+' + stimText(earned), auto ? 'info' : 'score', r, c);
    if (count >= 10) { this.popup(`CHAIN ${count}マス!`, 'chain', Math.min(r + 1, this.board.rows - 1), c); this.shout(); }
    if (count >= 25) this.unlock('chain25');
    if (this.combo >= 5 && this.combo % 5 === 0) { this.popup(`x${this.combo} COMBO!!`, 'combo', Math.max(r - 1, 0), c); this.shout(); }
    this.spawnDanmaku(Math.min(8, 1 + Math.floor(count / 4)));
    if (count >= 12) this.addCrack();
    const slotHit = [...this.slotCells].filter(i => ids.has(i));
    if (slotHit.length) { slotHit.forEach(i => this.slotCells.delete(i)); this.startSlot(); }
    if (auto) Sound.play('bounce');
    else { Sound.play('open', this.combo); if (count >= 10) Haptics.heavy(); else Haptics.light(); }
    if (count >= 15) this.shake();
    if (this.board.safeRemaining === 1 && !this.lastCell) {
      this.lastCell = true; this.clocks.heartbeat = 0; this.applyAmbience();
      this.popup('ラスト1マス!', 'combo');
      this.spawnDanmaku(4, ['ごくり', 'こわ', 'いけ！', 'たのむ', '手汗やばい']);
    }
  }

  // ----- 勝ち負け -----
  explode(i) {
    this.board.open(i);
    this.explodedIndex = i; this.phase = 'lost'; this.combo = 0;
    this.endLastCell();
    this.refresh();
    this.shake();
    this.popup('ドカーン!', 'fever', this.board.row(i), this.board.col(i));
    Sound.play('explosion'); Haptics.error();
    setTimeout(() => { this.revealMines = true; this.refresh(); }, 250);
    this.spawnDanmaku(6, ['あ', 'あーあ', '草', '乙', 'ドンマイ', 'wwwww', 'やっちゃった']);
    this.addCrack(); this.addCrack();
    const openedSafe = this.board.safeTotal - this.board.safeRemaining;
    if (this.clearStreak > 0 || openedSafe / this.board.safeTotal >= 0.4) {
      const id = this.boardID;
      setTimeout(() => {
        if (this.boardID === id && this.phase === 'lost') { this.adSession = { purpose: 'revive', started: null, id: Math.random() }; this.refresh(); }
      }, 900);
    } else this.finalizeLoss(1400);
  }
  finalizeLoss(delay) {
    this.clearStreak = 0;
    const id = this.boardID;
    setTimeout(() => { if (this.boardID === id && this.phase === 'lost') { this.newBoard(); this.refresh(); } }, delay);
  }
  revive() {
    if (this.phase !== 'lost' || this.explodedIndex == null) return;
    const i = this.explodedIndex;
    this.board.close(i); this.board.setFlag(i, true);
    this.explodedIndex = null; this.revealMines = false; this.phase = 'playing';
    this.refresh();
    this.popup('復活!!', 'fever', this.board.row(i), this.board.col(i));
    Sound.play('revive'); Haptics.success();
    this.spawnDanmaku(4, ['復活！', '広告えらい', 'おかえり', 'まだいける']);
    if (this.board.safeRemaining === 1) { this.lastCell = true; this.applyAmbience(); }
  }
  win() {
    this.phase = 'won'; this.clears++; this.clearStreak++;
    for (const c of this.board.cells) if (c.isMine) this.board.setFlag(c.id, true);
    if (this.lastCell) this.unlock('lastCell');
    this.endLastCell();
    this.v && this.v.celebrate();
    const bonus = this.earn(this.board.safeTotal * this.cellValue * this.streakMultiplier);
    this.refresh();
    this.popup('CLEAR! +' + stimText(bonus), 'fever');
    Sound.play('fanfare'); Haptics.success();
    this.shout(undefined, true);
    this.spawnDanmaku(8, ['GG', 'うますぎ', '神', '888888', 'クリアおめ', '天才か？']);
    if (this.cracks.length) { this.cracks = []; this.popup('画面修理完了', 'info', this.board.rows - 2); }
    if (Math.random() < 0.15) this.dropEgg('クリア');
    this.unlock('firstClear');
    if (this.clears >= 10) this.unlock('clears10');
    if (this.clears >= 50) this.unlock('clears50');
    this.save();
    const id = this.boardID;
    setTimeout(() => { if (this.boardID === id && this.phase === 'won') { this.newBoard(); this.refresh(); } }, 1300);
  }
  newBoard() {
    this.boardID++;
    this.board = Board.of('easy');
    this.phase = 'ready'; this.explodedIndex = null; this.revealMines = false;
    this.luckyCells = new Set(); this.slotCells = new Set();
    this.freshToken++; this.freshDepth = new Map();
    this.endLastCell();
  }
  endLastCell() { if (this.lastCell) { this.lastCell = false; this.applyAmbience(); } }

  // ----- 広告 -----
  watchAd() { if (this.adSession && !this.adSession.started) { this.adSession.started = Date.now(); Sound.play('button'); this.refresh(); } }
  finishAd() {
    const s = this.adSession;
    if (!s || !s.started || Date.now() - s.started < 4900) return;
    this.adSession = null;
    this.bump('ads'); this.unlock('adWatched');
    if (s.purpose === 'revive') this.revive();
    else if (this.offlineReward) {
      const e = this.earn(this.offlineReward.amount * 2, false);
      this.popup('おかえり×2 +' + stimText(e), 'fever');
      Sound.play('cash');
      this.offlineReward = null;
    }
    this.save(); this.refresh();
  }
  declineAd() {
    const s = this.adSession;
    if (!s || s.started) return;
    this.adSession = null;
    if (s.purpose === 'revive') this.finalizeLoss(200);
    this.refresh();
  }

  // ----- ログボ・放置収益 -----
  checkWelcome() {
    const now = Date.now();
    if (this.lastSeen) {
      const seconds = (now - this.lastSeen) / 1000;
      if (seconds > 60) {
        if (this.owns('pet')) this.petHunger = Math.max(0, this.petHunger - seconds / 150);
        this.applyOfflineFish(Math.min(seconds, 8 * 3600));
        const amount = Math.round(this.basePerSecond * this.prestigeMultiplier * Math.min(seconds, 8 * 3600) * 0.5);
        if (amount >= 1) this.offlineReward = { seconds, amount };
      }
    }
    const d = new Date(now), today = dayString(d);
    if (this.lastLoginDay !== today) {
      const y = new Date(now); y.setDate(y.getDate() - 1);
      this.loginStreak = this.lastLoginDay === dayString(y) ? this.loginStreak + 1 : 1;
      this.lastLoginDay = today;
      const base = Math.max(200, this.basePerSecond * 120 + this.cellValue * 50);
      this.loginBonus = { streak: this.loginStreak, dayIndex: (this.loginStreak - 1) % 7, rewards: LOGIN_MULT.map(m => Math.round(base * m)) };
    }
    this.save();
  }
  claimLoginBonus() {
    const b = this.loginBonus;
    if (!b) return;
    const reward = b.rewards[b.dayIndex];
    this.earn(reward, false);
    this.loginBonus = null;
    Sound.play('fanfare'); Haptics.success();
    this.popup('ログボ +' + stimText(reward), 'fever');
    if (b.streak >= 7) this.unlock('login7');
    this.save(); this.refresh();
  }
  claimOffline(double) {
    const r = this.offlineReward;
    if (!r || this.adSession) return;
    if (double) this.adSession = { purpose: 'doubleOffline', started: Date.now(), id: Math.random() };
    else { this.earn(r.amount, false); Sound.play('cash'); this.offlineReward = null; this.save(); }
    this.refresh();
  }

  // ----- フェス -----
  updateFest(now) {
    const pos = (now / 1000) % FEST_CYCLE;
    const active = pos < FEST_LENGTH;
    this.festSeconds = Math.ceil(active ? FEST_LENGTH - pos : FEST_CYCLE - pos);
    if (active !== this.festActive) {
      this.festActive = active;
      if (active) {
        this.popup('脳汁2倍フェス開幕!!', 'fever');
        Sound.play('fever'); Haptics.success();
        this.spawnDanmaku(6, ['フェスきた', '2倍！！', '稼ぎどき', 'うおおお']);
      } else this.popup('フェス終了…', 'info');
      this.refresh();
    }
    if (active) this.unlock('festa');
  }

  // ----- DVD -----
  dvdBounce(corner) {
    if (this.showEnding) return;
    if (corner) {
      const reward = this.earn(this.cellValue * 200 + this.basePerSecond * 30);
      this.popup('CORNER!! +' + stimText(reward), 'fever');
      this.shake(); Sound.play('ssr'); Haptics.success();
      this.shout(['角ぃぃぃ！', 'かどーーー！', '奇跡！'], true);
      this.spawnDanmaku(8, ['角！！！', 'かどおおお', '見た？', '伝説', 'スクショした']);
      this.bump('corners'); this.unlock('corner');
    } else { this.earn(this.cellValue * 3); Sound.play('bounce'); }
  }

  // ----- 通知 -----
  pushNotification() {
    const [icon, color, app, message] = pick(NOTIFICATION_POOL);
    const note = { id: Math.random(), icon, color, app, message, reward: Math.round(this.basePerSecond * 4 + this.cellValue * 8) };
    this.notifications.unshift(note);
    if (this.notifications.length > 3) this.notifications.pop();
    Sound.play('notify'); Haptics.light();
    setTimeout(() => { this.notifications = this.notifications.filter(n => n.id !== note.id); this.refresh(); }, 6000);
    this.refresh();
  }
  collectNotification(id) {
    const note = this.notifications.find(n => n.id === id);
    if (!note) return;
    const e = this.earn(note.reward);
    this.notifications = this.notifications.filter(n => n.id !== id);
    this.popup('+' + stimText(e), 'score', 0);
    Sound.play('cash'); Haptics.medium();
    this.refresh();
  }

  // ----- 弾幕 -----
  spawnDanmaku(amount, pool) {
    if (!this.owns('danmaku') || amount <= 0) return;
    const src = pool || DANMAKU_POOL, now = Date.now();
    const n = amount * Math.min(this.level('danmaku'), 3);
    for (let k = 0; k < n && this.danmaku.length < 40; k++) {
      this.danmaku.push({ text: pick(src), lane: randInt(0, 9), color: pick(DANMAKU_COLORS), size: rand(15, 24), born: now + rand(0, 600), speed: rand(110, 190) });
    }
  }

  // ----- 投げ銭 -----
  pushSuperChat() {
    let roll = Math.random() * SUPERCHAT_TIERS.reduce((s, t) => s + t[3], 0), tier = SUPERCHAT_TIERS[0];
    for (const t of SUPERCHAT_TIERS) { if (roll < t[3]) { tier = t; break; } roll -= t[3]; }
    const chat = { id: Math.random(), name: pick(SUPERCHAT_NAMES), message: pick(SUPERCHAT_MESSAGES), yen: tier[0], color: tier[1],
      reward: Math.round((this.basePerSecond * 3 + this.cellValue * 10) * tier[2] * (1 + 0.2 * (this.level('superChat') - 1))) };
    this.superChats.push(chat);
    if (this.superChats.length > 2) this.superChats.shift();
    Sound.play('notify');
    if (tier[0] >= 5000) this.spawnDanmaku(4, ['赤スパ！', 'ナイスパ', '金持ち', 'うおお']);
    setTimeout(() => { this.superChats = this.superChats.filter(c => c.id !== chat.id); this.refresh(); }, 7000);
    this.refresh();
  }
  collectSuperChat(id) {
    const chat = this.superChats.find(c => c.id === id);
    if (!chat) return;
    const e = this.earn(chat.reward);
    this.superChats = this.superChats.filter(c => c.id !== id);
    this.popup(`¥${fmtInt(chat.yen)} → +${stimText(e)}`, 'chain', this.board.rows - 1);
    Sound.play('cash'); Haptics.medium();
    if (this.bump('superChats') >= 10) this.unlock('superChat10');
    this.refresh();
  }

  // ----- ペット -----
  tickPet(dt) {
    this.petHunger = Math.max(0, this.petHunger - dt / 150);
    if (this.petHunger >= 0.3) return;
    if ((this.clocks.cry -= dt) <= 0) {
      this.clocks.cry = 7;
      Sound.play('cry'); Haptics.light();
      if (this.petHunger <= 0) this.unlock('petStarved');
    }
  }
  feedPet() {
    const cost = this.petFoodCost;
    if (!this.owns('pet') || this.stim < cost) { Haptics.warning(); return; }
    this.stim -= cost; this.petHunger = 1;
    Sound.play('buy'); Haptics.medium();
    this.bump('petFeeds'); this.unlock('petFed');
    this.v && this.v.petFed();
    this.refresh();
  }

  // ----- 鳥 -----
  tickBird(dt) {
    const k = this.clocks;
    if (this.birdVisible) {
      if ((k.birdNag -= dt) <= 0) {
        k.birdNag = 6; this.birdAnger++; this.birdLine = pick(BIRD_ANGRY);
        Sound.play('notify'); Haptics.medium(); this.refresh();
      }
    } else if ((k.bird -= dt) <= 0) {
      this.birdLine = pick(BIRD_CALM); this.birdAnger = 0; k.birdNag = 6; this.birdVisible = true;
      Sound.play('notify'); this.refresh();
    }
  }
  dismissBird() {
    if (!this.birdVisible) return;
    this.birdVisible = false;
    this.clocks.bird = rand(45, 80);
    const e = this.earn((this.cellValue * 20 + this.basePerSecond * 5) * this.level('studyBird'));
    this.popup('鳥を無視 +' + stimText(e), 'info', null, this.board.cols - 2);
    Sound.play('button');
    if (this.bump('birdIgnored') >= 10) this.unlock('birdIgnored10');
    this.refresh();
  }

  // ----- ヒビ -----
  addCrack() {
    if (!this.owns('cracks')) return;
    this.cracks.push({ x: rand(0.1, 0.9), y: rand(0.15, 0.85), seed: Math.floor(Math.random() * 2 ** 31), scale: rand(0.7, 1.3) });
    if (this.cracks.length > 8) this.cracks.shift();
    Sound.play('crack');
    if (this.cracks.length >= 8) this.unlock('cracked');
  }

  // ----- スロット -----
  startSlot() {
    const win = Math.random() < 0.35;
    let result;
    if (win) { const s = pick(SLOT_SYMBOLS); result = [s, s, s]; }
    else do { result = [pick(SLOT_SYMBOLS), pick(SLOT_SYMBOLS), pick(SLOT_SYMBOLS)]; } while (result[0] === result[1] && result[1] === result[2]);
    const spin = { id: Math.random(), symbols: result, win, started: performance.now() };
    this.slotSpin = spin;
    Sound.play('gacha');
    this.spawnDanmaku(3, ['スロットきた', 'そろえ！', 'たのむ']);
    const id = this.boardID;
    [400, 800, 1200].forEach(ms => setTimeout(() => { Sound.play('slotStop'); Haptics.light(); }, ms));
    setTimeout(async () => {
      if (this.slotSpin !== spin) return;
      if (win) {
        const reward = this.earn(this.cellValue * 50 + this.basePerSecond * 10);
        this.popup('JACKPOT!! +' + stimText(reward), 'fever');
        Sound.play('ssr'); Haptics.success(); this.shake();
        this.shout(['ジャックポット！', 'そろったー！'], true);
        this.spawnDanmaku(6, ['そろった！！', '777', '神台', 'ジャックポット']);
        this.bump('slotWins'); this.unlock('slotWin');
        if (Math.random() < 0.5) this.dropEgg('スロット');
        for (let k = 0; k < 8; k++) {
          if (this.boardID !== id || this.phase !== 'playing') break;
          this.openOneSafeCell();
          await sleep(90);
        }
      } else {
        const reward = this.earn(this.cellValue * 5);
        this.popup('ハズレ… +' + stimText(reward), 'info');
      }
      await sleep(800);
      if (this.slotSpin === spin) { this.slotSpin = null; this.refresh(); }
    }, 1500);
    this.refresh();
  }

  // ----- 株 -----
  stepStock() {
    const vol = Math.min(0.15, 0.06 * (1 + 0.1 * (this.level('stocks') - 1)));
    let p = this.stockPrice * Math.exp(rand(-1, 1) * vol) + (100 - this.stockPrice) * 0.03;
    if (Math.random() < 0.01) { p *= 1.6; this.popup('$DOPA 爆上げ!!', 'chain', 1); }
    else if (Math.random() < 0.01) { p *= 0.6; this.popup('$DOPA 暴落…', 'combo', 1); }
    this.stockPrice = clamp(p, 20, 400);
    this.stockHistory.push(this.stockPrice);
    if (this.stockHistory.length > 60) this.stockHistory.shift();
  }

  // ----- ガチャ -----
  rollGacha() {
    const cost = this.gachaCost;
    if (!this.owns('gacha') || this.gachaResult || this.stim < cost || this.isBlocked) { Haptics.warning(); return; }
    this.stim -= cost; this.gachaRolls++;
    const bonus = this.level('gacha') - 1;
    const ssrRate = Math.min(0.08, 0.02 + 0.005 * bonus), srRate = ssrRate + Math.min(0.2, 0.1 + 0.01 * bonus);
    const roll = Math.random();
    const [rarity, mult] = roll < ssrRate ? ['SSR', 20] : roll < srRate ? ['SR', 4] : roll < srRate + 0.28 ? ['R', 1.5] : ['N', 0.5];
    const reward = Math.round(cost * mult);
    this.earn(reward, false);
    const result = { id: Math.random(), rarity, reward };
    this.gachaResult = result;
    if (rarity === 'SSR') {
      Sound.play('ssr'); Haptics.success(); this.shake();
      this.shout(['SSR！！！', '神引き！！'], true);
      this.spawnDanmaku(8, ['SSR！！', '神引き', 'うそだろ', 'おめ！', '888888']);
      this.unlock('ssr');
    } else if (rarity === 'SR') { Sound.play('ssr'); Haptics.heavy(); }
    else { Sound.play('gacha'); Haptics.light(); }
    this.save();
    setTimeout(() => { if (this.gachaResult === result) { this.gachaResult = null; this.refresh(); } }, 1800);
    this.refresh();
  }

  // ----- 実況ボイス -----
  shout(lines = HYPE_LINES, force = false) {
    if (!this.owns('hypeVoice') || this.showEnding) return;
    const interval = Math.max(0.5, 1.5 / this.level('hypeVoice')) * 1000;
    if (!force && Date.now() - this.lastVoice < interval) return;
    this.lastVoice = Date.now();
    Voice.say(pick(lines));
  }

  // ----- 魚 -----
  get fishCapacity() { return this.level('aquarium') * 5; }
  get hasTankSpace() { return this.fish.length < this.fishCapacity; }
  get eggPrice() { return Math.round(300 * Math.pow(1.25, this.fish.length)); }
  get fishFoodCost() { return Math.round(20 + this.basePerSecond * 2); }
  get hungryFish() { return this.fish.filter(f => f.hunger < 0.99); }
  get swimmingFish() { return this.fish.filter(f => f.swimming && Fish.stageIndex(f) > 0).slice(0, MAX_SWIMMING); }
  buyEgg() {
    const price = this.eggPrice;
    if (!this.owns('aquarium') || !this.hasTankSpace || this.stim < price || this.isBlocked) { Haptics.warning(); return; }
    this.stim -= price;
    this.addEgg('');
    Sound.play('gacha');
    this.save(); this.refresh();
  }
  dropEgg(reason) {
    if (!this.owns('aquarium')) return;
    if (this.hasTankSpace) this.addEgg(reason + 'で');
    else this.popup('水槽が満員… +' + stimText(this.earn(this.eggPrice * 0.3)), 'info');
  }
  addEgg(prefix) {
    const rarity = Fish.randomRarity();
    this.fish.push(Fish.create(rarity, this.swimmingFish.length < MAX_SWIMMING));
    const rare = RARITY[rarity].rank >= 2;
    this.popup(`${prefix}${RARITY[rarity].label}の卵GET!`, rare ? 'fever' : 'chain');
    if (rare) { Sound.play('ssr'); this.spawnDanmaku(3, ['レア卵！', 'なにが生まれる？', 'あたりの予感']); }
    Haptics.medium();
  }
  addFishXP(f, xp, events) {
    const before = Fish.stageIndex(f);
    f.xp += xp;
    const after = Fish.stageIndex(f);
    if (after !== before) events.push([f, after, before]);
  }
  growFish(xp) {
    if (!this.fish.length) return;
    const events = [];
    for (const f of this.fish) if (f.hunger > 0) this.addFishXP(f, xp, events);
    events.forEach(([f, s, b]) => this.celebrateGrowth(f, s, b));
  }
  tickFish(dt) {
    if (!this.fish.length) return;
    const events = [];
    for (const f of this.fish) {
      f.hunger = Math.max(0, f.hunger - dt / FISH_HUNGER_SECONDS);
      if (f.hunger > 0) this.addFishXP(f, FISH_XP_PER_SECOND * dt, events);
    }
    events.forEach(([f, s, b]) => this.celebrateGrowth(f, s, b));
    this.v && this.v.fishChanged();
  }
  applyOfflineFish(seconds) {
    for (const f of this.fish) {
      f.xp += FISH_XP_PER_SECOND * Math.min(seconds, f.hunger * FISH_HUNGER_SECONDS);
      f.hunger = Math.max(0, f.hunger - seconds / FISH_HUNGER_SECONDS);
      if (Fish.stageIndex(f) > 0) this.dex.add(f.species);
    }
  }
  celebrateGrowth(f, stage, before = stage - 1) {
    const sp = SPEC[f.species], rare = RARITY[sp.rarity].rank >= 2;
    // 卵からかえった（一気に若魚以上になった場合も含む）
    if (before === 0 && stage >= 1) {
      this.dex.add(f.species);
      this.popup(`孵化! ${sp.name}(${RARITY[sp.rarity].label})`, rare ? 'fever' : 'chain');
      Sound.play(rare ? 'ssr' : 'revive'); Haptics.success();
      this.spawnDanmaku(3, ['生まれた！', 'かわいい', sp.name + 'だ', '命の誕生']);
      this.unlock('firstFish');
      if (sp.rarity === 'ssr') this.unlock('ssrFish');
      if (this.dex.size >= SPECIES.length) this.unlock('fishDex');
    }
    if (stage === 2 && before >= 1) this.popup(Fish.name(f) + 'が若魚に!', 'info');
    if (stage === 3) {
      this.popup(Fish.name(f) + 'が成魚に!!', 'combo');
      Sound.play('fanfare');
      if (this.fish.filter(x => Fish.stageIndex(x) === 3).length >= 10) this.unlock('adultFish10');
    }
    this.v && this.v.fishChanged();
  }
  feedFish(id) {
    const f = this.fish.find(x => x.id === id), cost = this.fishFoodCost;
    if (!f || this.stim < cost) { Haptics.warning(); return; }
    this.stim -= cost;
    f.hunger = 1;
    const events = [];
    this.addFishXP(f, 40, events);
    Sound.play('buy'); Haptics.light();
    events.forEach(([x, s, b]) => this.celebrateGrowth(x, s, b));
    this.v && this.v.fishChanged();
  }
  feedAllFish() {
    const targets = this.hungryFish, cost = this.fishFoodCost * targets.length;
    if (!targets.length || this.stim < cost) { Haptics.warning(); return; }
    this.stim -= cost;
    const events = [];
    for (const f of targets) { f.hunger = 1; this.addFishXP(f, 40, events); }
    Sound.play('buy'); Haptics.medium();
    events.forEach(([x, s, b]) => this.celebrateGrowth(x, s, b));
    this.v && this.v.fishChanged();
  }
  toggleSwimming(id) {
    const f = this.fish.find(x => x.id === id);
    if (!f) return;
    if (!f.swimming && this.swimmingFish.length >= MAX_SWIMMING) { Haptics.warning(); return; }
    f.swimming = !f.swimming; Haptics.light();
    this.v && this.v.fishChanged();
  }
  renameFish(id, name) {
    const f = this.fish.find(x => x.id === id);
    if (!f) return;
    f.nickname = name.trim().slice(0, 12);
    this.save(); this.v && this.v.fishChanged();
  }
  releaseValue(f) { return Math.round(RARITY[SPEC[f.species].rarity].income * Math.max(0.1, Fish.stage(f).income) * 60 + 50); }
  releaseFish(id) {
    const f = this.fish.find(x => x.id === id);
    if (!f) return;
    const e = this.earn(this.releaseValue(f), false);
    this.fish = this.fish.filter(x => x.id !== id);
    this.popup(`さようなら ${Fish.name(f)} +${stimText(e)}`, 'info');
    Sound.play('cash');
    this.save(); this.v && this.v.fishChanged();
  }

  // ----- 実績 -----
  unlock(id) {
    if (this.achievements.has(id)) return;
    this.achievements.add(id);
    const reward = this.earn(Math.round(Math.max(100, this.basePerSecond * 30 + this.cellValue * 20)), false);
    this.toastQueue.push({ id: Math.random(), achievement: ACH[id], reward });
    this.showNextToast();
    this.clocks.save = 5;
  }
  showNextToast() {
    if (this.toast || !this.toastQueue.length) return;
    this.toast = this.toastQueue.shift();
    Sound.play('ssr'); Haptics.success();
    this.v && this.v.showToast(this.toast);
    setTimeout(() => { this.toast = null; this.v && this.v.showToast(null); setTimeout(() => this.showNextToast(), 350); }, 2400);
  }

  // ----- エンディング・転生 -----
  triggerEnding() {
    Sound.stopAllLoops(); Voice.stop();
    this.notifications = []; this.superChats = []; this.danmaku = []; this.birdVisible = false;
    this.save(true);
    setTimeout(() => { this.showEnding = true; this.refresh(); }, 600);
  }
  prestige() {
    const gain = this.prestigeGain;
    if (gain <= 0) { Haptics.warning(); return; }
    this.prestigePoints += gain; this.prestigeCount++;
    Voice.stop();
    const aquarium = this.level('aquarium');
    this.stim = 0; this.totalEarned = 0; this.levels = aquarium ? { aquarium } : {};
    this.gachaRolls = 0; this.combo = 0; this.clearStreak = 0; this.petHunger = 1;
    this.stockPrice = 100; this.stockHistory = Array(60).fill(100);
    this.notifications = []; this.superChats = []; this.danmaku = []; this.cracks = [];
    this.gachaResult = null; this.slotSpin = null; this.adSession = null; this.birdVisible = false; this.clocks.bird = 25;
    this.newBoard();
    this.showEnding = false;
    this.applyAmbience();
    Sound.play('fanfare'); Haptics.success();
    this.refresh();
    this.popup(`転生!! 倍率 x${this.prestigeMultiplier.toFixed(1)}`, 'fever');
    this.unlock('prestige');
    this.save(false);
  }

  save(endingSeen) {
    this.clocks.save = 0;
    store.set('stim', {
      stim: this.stim, totalEarned: this.totalEarned, lifetimeEarned: this.lifetimeEarned, levels: this.levels,
      cellsOpened: this.cellsOpened, clears: this.clears, gachaRolls: this.gachaRolls,
      endingSeen: endingSeen != null ? endingSeen : this.showEnding,
      prestigePoints: this.prestigePoints, prestigeCount: this.prestigeCount, achievements: [...this.achievements].sort(),
      counters: this.counters, lastSeen: Date.now(), lastLoginDay: this.lastLoginDay, loginStreak: this.loginStreak,
      petHunger: this.petHunger, fish: this.fish, dex: [...this.dex].sort()
    });
  }
}

function fitCanvas(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  return { ctx, W, H };
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const tri = (d, r) => { const m = d % (2 * r); return m <= r ? m : 2 * r - m; };

// ----- 魚の絵 -----
const FishArt = {
  draw(ctx, sp, x, y, L, right, t, phase) {

    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  eye(ctx, x, y, r) {
    this.ell(ctx, x, y, r * 2, r * 2); ctx.fillStyle = '#fff'; ctx.fill();
    this.ell(ctx, x + r * 0.25, y, r * 1.1, r * 1.1); ctx.fillStyle = '#000'; ctx.fill();
  },
  tail(ctx, bx, len, spread, swing) {

  goldfish(ctx, s, L, sw, line) {

    ctx.beginPath(); ctx.moveTo(0.36 * L, -0.02 * L); ctx.quadraticCurveTo(0.3 * L, 0.18 * L, 0.1 * L, 0.14 * L); ctx.stroke();
    ctx.fillStyle = '#fff';

  oarfish(ctx, s, L, sw, line, t, phase) {

    ctx.globalAlpha = 0.85; ctx.fillStyle = s.color; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = '#000'; ctx.lineWidth = line; ctx.stroke();
    ctx.fillStyle = '#000'; this.ell(ctx, -0.08 * L, -0.18 * L, 0.06 * L, 0.06 * L); ctx.fill(); this.ell(ctx, 0.08 * L, -0.18 * L, 0.06 * L, 0.06 * L); ctx.fill();
  },
  egg(ctx, rarity, x, y, size, t) {

    ctx.restore();

    ctx.restore();

function fishState(f, t, W, H) {
  const sp = SPEC[f.species], L = sp.length * Fish.stage(f).size, span = W + L * 2, speed = sp.speed * (0.8 + 0.4 * f.seed2);
  let travel = speed * t + f.seed * span * 2;
  if (sp.swim === 'dash') travel += speed * 0.2 * Math.sin(t * 2 + f.seed * 9);
  const m = travel % (span * 2), right = m < span;
  const x = (right ? m : span * 2 - m) - L;
  const amp = { straight: [1.2, 6], wiggle: [2.5, 14], float: [0.6, 40], dash: [0.9, 10], glide: [0.4, 24] }[sp.swim];
  return { x, y: H * (0.12 + 0.76 * f.seed2) + Math.sin(t * amp[0] + f.seed * 20) * amp[1], L, right };
}
function drawFishTank(ctx, fish, W, H, t) {
  const list = [...fish].sort((a, b) => SPEC[b.species].length - SPEC[a.species].length);
  for (const f of list) { const s = fishState(f, t, W, H); FishArt.draw(ctx, SPEC[f.species], s.x, s.y, s.L, s.right, t, f.seed); }
}
function drawFishIcon(cv, f, speciesId, egg, t = 0) {
  const { ctx, W, H } = fitCanvas(cv);
  const sp = SPEC[speciesId];
  if (egg) FishArt.egg(ctx, sp.rarity, W / 2, H / 2, H * 0.6, t);
  else FishArt.draw(ctx, sp, W / 2, sp.shape === 'jelly' ? H * 0.4 : H / 2, Math.min(W * 0.8, sp.length), true, t, 0);
}

// ----- ヒビ -----
function drawCracks(ctx, cracks, W, H) {
  for (const c of cracks) {
    const rng = mulberry32(c.seed), cx = c.x * W, cy = c.y * H;
    ctx.beginPath();
    const rays = 7 + Math.floor(rng() * 5);
    for (let k = 0; k < rays; k++) {
      let a = k / rays * Math.PI * 2 + (rng() - 0.5) * 0.5, x = cx, y = cy;
      ctx.moveTo(x, y);
      const segs = 3 + Math.floor(rng() * 4);
      for (let s = 0; s < segs; s++) {
        a += (rng() - 0.5) * 0.7;
        const len = (14 + rng() * 20) * c.scale;
        x += Math.cos(a) * len; y += Math.sin(a) * len;
        ctx.lineTo(x, y);
        if (rng() < 0.25) {
          const b = a + (0.5 + rng() * 0.4) * (rng() < 0.5 ? 1 : -1);
          ctx.lineTo(x + Math.cos(b) * len * 0.8, y + Math.sin(b) * len * 0.8);
          ctx.moveTo(x, y);
        }
      }
    }
    const r = 6 * c.scale;
    ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
}

// ----- DVDロゴ -----
const DVD_COLORS = [C.pink, C.cyan, C.yellow, C.lime, C.orange, C.lavender];
class DVDTracker {
  constructor() { this.prev = []; this.lastCorner = 0; this.start = performance.now(); }
  draw(ctx, n, W, H, onBounce) {
    const lw = 96, lh = 46, t = (performance.now() - this.start) / 1000;
    for (let i = 0; i < n; i++) {
      const tt = t + i * 3.7, rx = Math.max(1, W - lw), ry = Math.max(1, H - lh);
      const dx = tt * (95 + i * 17), dy = tt * (70 + i * 11);
      const xb = Math.floor(dx / rx), yb = Math.floor(dy / ry), x = tri(dx, rx), y = tri(dy, ry);
      const p = this.prev[i];
      if (p && (p.xb !== xb || p.yb !== yb)) {
        const nearX = x < 10 || x > rx - 10, nearY = y < 10 || y > ry - 10;
        const corner = nearX && nearY;
        if (corner) { if (performance.now() - this.lastCorner > 500) { this.lastCorner = performance.now(); onBounce(true); } }
        else onBounce(false);
      }
      this.prev[i] = { xb, yb };
      const color = DVD_COLORS[(xb + yb + i) % DVD_COLORS.length];
      ctx.save(); ctx.translate(x, y);
      ctx.shadowColor = color; ctx.shadowBlur = 10;
      ctx.fillStyle = color; ctx.font = "26px 'Dela Gothic One', system-ui, sans-serif";
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('DOPA', lw / 2, 0);
      ctx.beginPath(); ctx.ellipse(lw / 2, 36, 35, 6.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.font = '900 8px system-ui'; ctx.textBaseline = 'middle'; ctx.fillText('V I D E O', lw / 2, 36.5);
      ctx.restore();
    }
  }
}

// ----- ゲーム実況 -----
function drawRunner(cv, t) {
  const { ctx, W: w, H: h } = fitCanvas(cv);
  const gy = h * 0.78;
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, C.tile); g.addColorStop(1, C.pink);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(59,34,184,.8)';
  for (let i = 0; i < 6; i++) { const x = i * 28 - (t * 20) % 28 - 10, bh = 18 + ((i * 7) % 5) * 5; ctx.fillRect(x, gy - bh, 18, bh); }
  ctx.fillStyle = C.well; ctx.fillRect(0, gy, w, h - gy);
  ctx.fillStyle = C.yellow;
  for (let i = 0; i < 8; i++) ctx.fillRect(i * 24 - (t * 120) % 24, gy + 4, 12, 3);
  for (let i = 0; i < 4; i++) {
    const p = ((t + i * 0.55) / 2.2) % 1, x = w + 10 - p * (w + 20), y = gy - 34 + Math.sin(i * 1.7) * 6;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
  }
  const phase = (t / 1.6) % 1, ox = w + 10 - phase * (w + 30);
  ctx.fillStyle = C.lime; ctx.fillRect(ox, gy - 14, 12, 14);
  const rx = 30, hit = (w + 10 - rx) / (w + 30), win = 0.22, dp = phase - (hit - win);
  const jump = dp >= 0 && dp <= win * 2 ? Math.sin(dp / (win * 2) * Math.PI) * 26 : 0;
  const by = gy - 18 - jump, leg = jump > 0 ? 0 : Math.sin(t * 22) * 4;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(rx - 2, by + 12); ctx.lineTo(rx - 2 + leg, by + 18); ctx.moveTo(rx + 3, by + 12); ctx.lineTo(rx + 3 - leg, by + 18); ctx.stroke();
  ctx.fillStyle = C.cyan; ctx.fillRect(rx - 5, by, 11, 13);
  ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(rx + 0.5, by - 4.5, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.fillRect(rx + 1, by - 7, 3, 3);
  ctx.fillStyle = '#fff'; ctx.font = '900 9px ui-monospace, monospace'; ctx.textBaseline = 'middle'; ctx.fillText('SCORE ' + Math.floor(t * 137), 6, 8);
}

function drawStock(cv, history) {
  const { ctx, W, H } = fitCanvas(cv);
  const lo = Math.min(...history) - 2, hi = Math.max(...history) + 2, up = history[history.length - 1] >= history[history.length - 2];
  ctx.beginPath();
  history.forEach((v, i) => { const x = W * i / (history.length - 1), y = H * (1 - (v - lo) / (hi - lo)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.strokeStyle = up ? C.lime : C.pink; ctx.lineWidth = 1.5; ctx.stroke();
  return up;
}

// ----- 謎の生き物 -----
function drawPet(ctx, cx, cy, hunger, t) {
  const mood = hunger > 0.6 ? 2 : hunger >= 0.3 ? 1 : 0;
  const hop = mood === 0 ? 0 : -Math.abs(Math.sin(t * (mood === 2 ? 5 : 2.5))) * 4, shiver = mood === 0 ? Math.sin(t * 30) * 1.5 : 0;
  ctx.save(); ctx.translate(cx + shiver, cy + hop + 4);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -15); ctx.quadraticCurveTo(-2, -22, 6, -23); ctx.stroke();
  ctx.fillStyle = C.pink; ctx.beginPath(); ctx.arc(6.5, -23.5, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -1, 20, 15, 0, 0, Math.PI * 2);
  ctx.fillStyle = mood === 0 ? '#8FA8FF' : C.lavender; ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
  for (const ex of [-8, 8]) {
    const ey = -3;
    if (mood === 2) { ctx.beginPath(); ctx.moveTo(ex - 3.5, ey + 1); ctx.quadraticCurveTo(ex, ey - 5, ex + 3.5, ey + 1); ctx.lineWidth = 2; ctx.stroke(); }
    else { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex, ey, 2.8, 0, Math.PI * 2); ctx.fill(); }
    if (mood === 0) { const drop = (t * 14 + ex) % 8; ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.ellipse(ex, ey + 5.5 + Math.abs(drop), 1.5, 2.5, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.lineWidth = 1.5; ctx.beginPath();
  if (mood === 2) { ctx.moveTo(-5, 4); ctx.quadraticCurveTo(0, 11, 5, 4); ctx.closePath(); ctx.fillStyle = C.pink; ctx.fill(); ctx.stroke(); }
  else if (mood === 1) { ctx.moveTo(-3, 6); ctx.lineTo(3, 6); ctx.stroke(); }
  else { ctx.moveTo(-4, 8); ctx.quadraticCurveTo(0, 3, 4, 8); ctx.stroke(); }
  ctx.restore();
}

function drawBird(ctx, cx, cy, anger, t) {
  const shake = Math.sin(t * 40) * Math.min(anger, 4), bob = Math.sin(t * 3) * 2, body = anger >= 2 ? C.pink : C.orange;
  ctx.save(); ctx.translate(cx + shake, cy + bob);

  ctx.strokeStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 34, 0, 0, Math.PI * 2); ctx.fillStyle = body; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 16, 18, 14, 0, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sd * 30, 9, 8, 13, 0, 0, Math.PI * 2); ctx.fillStyle = body; ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke(); }
  for (const ex of [-12, 12]) {
    const ey = -12;
    ctx.beginPath(); ctx.arc(ex, ey, 9, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex, ey, 10, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(ex, ey + 1.5, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
    if (anger > 0) { const tl = ex < 0 ? 1 : -1; ctx.beginPath(); ctx.moveTo(ex - 9, ey - 14 - 3 * tl); ctx.lineTo(ex + 9, ey - 14 + 3 * tl); ctx.stroke(); }
  }
  ctx.beginPath(); ctx.moveTo(-2, -12); ctx.lineTo(2, -12); ctx.stroke();

}

  // ----- 一時的な演出 -----

  // ----- 毎フレームの描画 -----
  draw(now) {
    const g = this.g, t = now / 1000;
    if (g.showEnding) return;
    const back = fitCanvas(this.backCv);
    if (g.owns('emojiRain')) drawEmojiRain(back.ctx, 24 * Math.min(g.level('emojiRain'), 4), back.W, back.H, t);
    if (g.owns('rain')) drawRain(back.ctx, 70 * Math.min(g.level('rain'), 4), back.W, back.H, t);
    if (g.owns('aquarium') && !this.fishInFront && !reduceMotion) drawFishTank(back.ctx, g.swimmingFish, back.W, back.H, t);
    const front = fitCanvas(this.frontCv);
    if (g.owns('aquarium') && this.fishInFront && !reduceMotion) drawFishTank(front.ctx, g.swimmingFish, front.W, front.H, t);
    if (g.owns('danmaku')) drawDanmaku(front.ctx, g.danmaku, front.W, front.H, Date.now());
    if (g.owns('dvd')) this.dvd.draw(front.ctx, Math.min(g.level('dvd'), 5), front.W, front.H, c => g.dvdBounce(c));
    if (g.cracks.length) drawCracks(front.ctx, g.cracks, front.W, front.H);
    if (g.owns('rainbow')) this.rainbowEl.style.filter = `hue-rotate(${(t * 90 * Math.min(g.level('rainbow'), 5)) % 360}deg)`;
    if (g.owns('ticker')) {
      const speed = 60 * Math.min(3, 1 + 0.3 * (g.level('ticker') - 1)), w = this.tickerTrack.offsetWidth / 2 || 1;
      this.tickerTrack.style.transform = `translateX(${-((t * speed) % w)}px)`;
    }
    this.runnersEl.querySelectorAll('canvas').forEach((cv, i) => drawRunner(cv, t + i * 5));
    if (g.owns('stocks')) {
      const up = drawStock(this.stockEl.querySelector('canvas'), g.stockHistory);
      const c = up ? C.lime : C.pink;
      this.stockEl.querySelector('.stkname').textContent = g.level('stocks') > 1 ? `$DOPA ×${g.level('stocks')}` : '$DOPA';
      const pr = this.stockEl.querySelector('.stkprice'); pr.textContent = (up ? '▲' : '▼') + g.stockPrice.toFixed(1);
      this.stockEl.style.color = c;
    }
    const pet = this.toolbarEl.querySelector('.petcv');
    if (pet) {
      const { ctx, W, H } = fitCanvas(pet), n = Math.min(Math.max(g.level('pet'), 1), 3), s = n === 1 ? 1 : n === 2 ? 0.75 : 0.6;
      ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(s, s);
      for (let i = 0; i < n; i++) drawPet(ctx, (i - (n - 1) / 2) * 34, 0, g.petHunger, t + i);
      ctx.restore();
    }
    const bird = this.birdEl.querySelector('canvas');
    if (bird && g.birdVisible) {
      const { ctx, W, H } = fitCanvas(bird), n = g.birdCount;
      for (let i = 0; i < n; i++) drawBird(ctx, W - 40 - i * 46 * (n > 1 ? 0.8 : 1), H / 2, g.birdAnger, t + i * 0.7);
    }
    if (g.slotSpin) this.drawSlot(now);
    if (g.adSession && g.adSession.started) this.updateAd();
  }

  // ----- 0.1秒ごと -----
  tick() {
    const g = this.g;
    const st = stimText(g.stim);
    if (this.stimEl.dataset.v !== st) { this.stimEl.innerHTML = popHTML(st, 34, C.yellow, [C.pink], 3); this.stimEl.dataset.v = st; }
    this.perSecEl.textContent = '毎秒 +' + stimText(g.perSecond);
    this.perSecEl.style.color = g.festActive ? C.yellow : C.cyan;
    this.prestigeEl.textContent = g.prestigePoints > 0 ? `転生 x${g.prestigeMultiplier.toFixed(1)}` : '';
    const affordable = ITEMS.filter(i => g.isRevealed(i.id) && g.canBuy(i.id)).length;
    this.badgeEl.textContent = affordable; this.badgeEl.classList.toggle('hidden', affordable === 0);
    this.renderFest();
    this.renderToolbarValues();
    if (this.sheetOpen) this.updateSheet();
  }

  // ----- 状態が変わったとき -----

    const g = this.g;

    this.el.style.background = g.festActive ? C.feverBG : C.base;

    this.renderToolbar();
    this.renderWidgets();
    this.renderNotifications();
    this.renderSuperChats();
    this.renderBird();
    this.renderCenter();
    this.renderPrompts();
    this.renderEnding();
    this.tick();
  }
  renderFest() {

    this.festEl.dataset.v = key;
    this.festEl.classList.toggle('active', g.festActive);
    this.festEl.innerHTML = g.festActive
      ? `<span>🔥 脳汁2倍フェス開催中！</span><span>残り ${mm(g.festSeconds)}</span>`
      : `<span>⏰ 次の脳汁2倍フェスまで</span><span style="color:${C.yellow}">${mm(g.festSeconds)}</span>`;

  renderWidgets() {

  renderBird() {

    if (g.gachaResult) {

      h('button', { class: 'btn ' + (key === Progress.difficulty ? '' : 'panel'), style: { height: '56px', ...(key === Progress.difficulty ? { '--fill': v.color } : {}) },
        'aria-pressed': key === Progress.difficulty,
        onclick: () => { Progress.difficulty = key; Progress.save(); Sound.play('button'); Haptics.light(); this.showTitle(); } },
        (key === Progress.difficulty ? '✓ ' : '') + v.label));
    return h('div', { class: 'screen', style: { gap: '14px', padding: '8px 20px 12px' } },
      h('div', { class: 'topbar' },
        h('span', { class: 'sticker', style: { background: C.pink, borderRadius: '999px', fontSize: '14px' } }, `🔥 連続 ${Progress.streak}日`),
        h('span', { class: 'chip', style: { color: C.yellow } }, '🪙 ' + fmtInt(Progress.coins)),
        h('div', { class: 'spacer' }),
        h('button', { class: 'btn panel sq', 'aria-label': '設定', onclick: () => this.settings() }, h('span', { class: 'ico' }, '⚙️'))),
      h('div', { class: 'logo', role: 'img', 'aria-label': 'ドパガキマインスイーパー', html:
        starburstSVG(300, C.pink) +
        `<div class="words">${popHTML('ドパガキ', 70, C.yellow, ['#000'], 6, 3)}${popHTML('マインスイーパー', 32, '#fff', [C.cyan], 4)}</div>` +
        `<span class="sticker badge">脳汁 100%</span>` }),
      h('div', { class: 'sample', 'aria-hidden': 'true' }, ...sample),
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn', style: { height: '92px', flex: 'none', '--radius': '22px', '--depth': '8px', borderWidth: '4px' },
        onclick: () => { Sound.unlock(); Sound.play('fanfare'); Haptics.heavy(); this.startNormal(); } },
        h('span', { class: 'display', style: { fontSize: '36px' } }, 'あそぶ！'),
        h('span', { style: { fontSize: '13px' } }, `STAGE ${Progress.stage} ・ ${d.label}`)),
      h('button', { class: 'btn pink', style: { height: '58px', flex: 'none', flexDirection: 'row', gap: '8px', '--radius': '18px', '--depth': '6px' },
        onclick: () => { Sound.unlock(); Sound.play('gacha'); Haptics.heavy(); this.startStim(); } },
        h('span', { class: 'ico', style: { fontSize: '20px' } }, '🧠'),
        h('span', { class: 'display', style: { fontSize: '22px' } }, '刺激モード'),
        h('span', { style: { fontSize: '11px', opacity: 0.8 } }, 'ショップで脳汁を買え')),
      h('div', { class: 'row' }, ...diffButtons),
      h('div', { class: 'levelbar' },
        h('span', { class: 'display', style: { fontSize: '18px', color: C.yellow } }, 'LV.' + Progress.level),
        h('div', { class: 'bar' }, h('i', { style: { width: (Progress.levelProgress * 100) + '%' } })),
        h('span', { style: { fontSize: '13px', color: C.lavender } }, `あと ${Progress.xpToNext} XP`)));
  },
  settings() {
    const row = (label, key) => {
      const sw = h('div', { class: 'switch' + (Progress[key] ? ' on' : ''), role: 'switch', 'aria-checked': Progress[key], 'aria-label': label, tabindex: '0' });
      sw.addEventListener('click', () => { Progress[key] = !Progress[key]; Progress.save(); sw.classList.toggle('on', Progress[key]); sw.setAttribute('aria-checked', Progress[key]); });
      return h('div', { class: 'toggle' }, h('span', null, label), sw);
    };
    const bg = h('div', { class: 'confirm' }, h('div', { class: 'card' },
      h('div', { class: 'display', style: { fontSize: '20px', textAlign: 'center' } }, '設定'),
      row('効果音', 'soundOn'), row('振動', 'hapticsOn'), row('画面の揺れ', 'shakeOn'),
      h('div', { class: 'toggle' }, h('span', null, 'ベストスコア'), h('span', null, fmtInt(Progress.bestScore))),
      h('div', { class: 'toggle', style: { borderBottom: 0 } }, h('span', null, 'ステージ'), h('span', null, String(Progress.stage))),
      h('div', { style: { fontSize: '11px', color: C.lavender } }, '端末の「視差効果を減らす」がオンのときは、揺れや一部のアニメーションを止めます。進行はこのブラウザに保存されます。'),
      h('button', { class: 'btn', style: { height: '50px' }, onclick: () => bg.remove() }, '閉じる')));
    bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
    this.root.append(bg);
  }
};
App.start();
if (document.fonts && document.fonts.load) {
  const mark = () => {
    const ok = [...document.fonts].some(f => f.family.replace(/["']/g, '') === 'Dela Gothic One' && f.status === 'loaded');
    document.body.classList.toggle('nodela', !ok);
  };
  document.body.classList.add('nodela');
  document.fonts.load("20px 'Dela Gothic One'").then(mark, mark);
  setTimeout(mark, 3000);
}

</script>
</body>
</html>
