<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1B0F3B">
<title>ドパガキマインスイーパー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root {
  --base: #1B0F3B; --panel: #2A1A5E; --well: #120A2A; --boardBG: #0B0620; --divider: #4A3690;
  --tile: #6B4BFF; --tileDark: #3B22B8; --tileLight: #9C85FF; --fresh: #3A1050;
  --yellow: #FFE600; --pink: #FF2E88; --pinkSoft: #FF4FA0; --cyan: #2EE6FF; --lime: #7CFF4F;
  --orange: #FF8A1F; --lavender: #C9BEFF; --feverBG: #3A0A3E; --gameOverBG: #2B0A1E;
  --display: "Dela Gothic One", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: ui-rounded, "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0B0620; overflow: hidden; }
body { font-family: var(--body); font-weight: 800; color: #fff; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font-family: inherit; font-weight: inherit; color: inherit; }
#app { position: relative; max-width: 480px; height: 100dvh; margin: 0 auto; background: var(--base); overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom)); }
.display { font-family: var(--display); font-weight: 400; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* --- 太フチ文字 --- */
.pop { font-family: var(--display); font-weight: 400; color: var(--yellow); -webkit-text-stroke: 2px #000; paint-order: stroke fill;
  text-shadow: 4px 4px 0 #000; line-height: 1.05; white-space: nowrap; }
.pop.s3 { -webkit-text-stroke: 3px #000; }

/* --- ステッカー --- */
.sticker { display: inline-block; color: #000; background: var(--yellow); border: 3px solid #000; border-radius: 4px; padding: 2px 10px;
  box-shadow: 3px 3px 0 #000; white-space: nowrap; }

/* --- 押すと沈むボタン --- */
.btn { --fill: var(--yellow); --text: #000; --depth: 5px; --radius: 16px; position: relative; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; border: 3px solid #000; border-radius: var(--radius); background: var(--fill); color: var(--text);
  box-shadow: 0 var(--depth) 0 #000; cursor: pointer; transition: transform .08s, box-shadow .08s; padding: 4px 8px; min-height: 40px; }
.btn:active:not(:disabled) { transform: translateY(var(--depth)); box-shadow: 0 0 0 #000; }
.btn:disabled { --fill: var(--panel); --text: rgba(255,255,255,.5); cursor: default; }
.btn.panel { --fill: var(--panel); --text: #fff; }
.btn.cyan { --fill: var(--cyan); } .btn.pink { --fill: var(--pink); --text: #fff; } .btn.lime { --fill: var(--lime); }
.btn.orange { --fill: var(--orange); } .btn.lavender { --fill: var(--lavender); } .btn.white { --fill: #fff; }
.btn.sq { width: 44px; height: 44px; min-height: 44px; padding: 0; --radius: 12px; --depth: 4px; }
.chunky { border: 3px solid #000; border-radius: 18px; box-shadow: 0 5px 0 #000; }
.ico { font-size: 18px; line-height: 1; }

/* --- タイトル --- */
.topbar { display: flex; align-items: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 3px solid #000; border-radius: 999px; background: var(--panel); font-size: 14px; }
.logo { position: relative; height: 270px; display: grid; place-items: center; margin-top: 4px; }
.logo svg { position: absolute; width: 300px; height: 300px; animation: spin 24s linear infinite; }
.logo .words { position: relative; transform: rotate(-6deg); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.logo .badge { position: absolute; right: 30px; bottom: 30px; transform: rotate(8deg); background: var(--cyan); font-size: 15px; }
@keyframes spin { to { transform: rotate(360deg); } }
.sample { display: flex; justify-content: center; gap: 6px; }
.levelbar { display: flex; align-items: center; gap: 10px; }
.bar { position: relative; flex: 1; height: 16px; background: var(--well); border: 3px solid #000; border-radius: 999px; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lime); border-radius: 999px; transition: width .6s ease-out; }
.row { display: flex; gap: 10px; }
.row > .btn { flex: 1; }
.spacer { flex: 1; min-height: 0; }

/* --- 盤面 --- */
.boardwrap { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
.board { position: relative; display: grid; gap: 4px; padding: 8px; background: var(--boardBG); border: 4px solid #000; border-radius: 18px; box-shadow: 0 6px 0 #000; }
.cell { position: relative; width: var(--cell); height: var(--cell); border-radius: calc(var(--cell) * .2); cursor: pointer; display: grid; place-items: center;
  font-family: var(--display); font-size: calc(var(--cell) * .55); line-height: 1; }
.cell.closed { background: linear-gradient(var(--tile) 0 0) top / 100% 89% no-repeat, var(--tileDark); border: 2px solid #000; }
.cell.closed::after { content: ""; position: absolute; left: 20%; right: 20%; top: 9%; height: 8%; min-height: 2px; background: var(--tileLight); border-radius: 9px; }
.cell.open { background: var(--well); border: 2px solid #000; animation: openPop .32s cubic-bezier(.3,1.6,.5,1) both; }
.cell.fresh { background: var(--fresh); border-color: var(--pink); box-shadow: 0 0 8px rgba(255,46,136,.8); }
.cell.flag { background: var(--yellow); border: 2px solid #000; animation: flagPop .25s cubic-bezier(.3,1.6,.5,1); }
.cell.flag::before { content: "🚩"; font-size: calc(var(--cell) * .5); font-family: system-ui; }
.cell.mine { background: var(--orange); border: 2px solid #000; }
.cell.mine.exploded { background: var(--pink); }
.cell.hiddenmine { background: var(--well); border: 2px solid #000; }
.cell.lucky { background: linear-gradient(var(--yellow) 0 0) top / 100% 89% no-repeat, var(--orange); border: 2px solid #000; animation: glow 1.2s ease-in-out infinite; }
.cell.lucky::before { content: "✦"; color: #fff; font-family: system-ui; text-shadow: 1px 1px 0 var(--orange); font-size: calc(var(--cell) * .5); }
.cell.slot::before { content: "777"; position: relative; z-index: 1; color: var(--yellow); font-size: calc(var(--cell) * .3); text-shadow: 1px 1px 0 #000; margin-bottom: 8%; }
.cell.pinged::before { content: ""; position: absolute; inset: -30%; border: 3px solid var(--cyan); border-radius: 50%; animation: ping 1.2s ease-out; }
.mineicon { width: 64%; height: 64%; }
@keyframes openPop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes flagPop { from { transform: scale(1.5); opacity: 0; } }
@keyframes glow { 50% { box-shadow: 0 0 10px var(--yellow); } }
@keyframes ping { from { transform: scale(.3); opacity: 1; } to { transform: scale(1); opacity: 0; } }
.n1 { color: var(--cyan); } .n2 { color: var(--lime); } .n3 { color: var(--pinkSoft); } .n4 { color: var(--yellow); }
.n5 { color: var(--orange); } .n6 { color: #B69CFF; } .n7 { color: #fff; } .n8 { color: #9E9E9E; }

/* --- ポップアップ --- */
.popup { position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%); animation: popup 1.1s ease forwards; white-space: nowrap; }
@keyframes popup { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 1; } 20% { transform: translate(-50%,-80%) scale(1.05); }
  50% { transform: translate(-50%,-80%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-200%) scale(1); opacity: 0; } }
.popup.score { font-family: var(--display); font-size: 26px; color: #fff; -webkit-text-stroke: 2px #000; paint-order: stroke fill; text-shadow: 3px 3px 0 var(--pink); rotate: -8deg; }
.popup.chain { font-family: var(--display); font-size: 16px; } .popup.chain > span { background: var(--cyan); rotate: 6deg; }
.popup.combo { font-family: var(--display); font-size: 18px; } .popup.combo > span { background: var(--pink); rotate: -8deg; }
.popup.info { font-family: var(--display); font-size: 16px; } .popup.info > span { background: var(--lime); rotate: -4deg; }
.popup.fever { font-family: var(--display); font-size: 46px; color: var(--yellow); -webkit-text-stroke: 3px #000; paint-order: stroke fill;
  text-shadow: 4px 4px 0 var(--pink), 8px 8px 0 #000; rotate: -6deg; }

/* --- 揺れ --- */
.shake { animation: shake .45s linear; }
@keyframes shake { 0%,100% { transform: none; } 15% { transform: translate(9px, 4px); } 30% { transform: translate(-8px, -5px); }
  45% { transform: translate(7px, 3px); } 60% { transform: translate(-5px, -2px); } 80% { transform: translate(3px, 1px); } }

/* --- 通常モード --- */
.hud { display: flex; align-items: center; justify-content: space-between; }
.timer { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.minechip { color: var(--pinkSoft); background: var(--well); font-family: var(--display); font-size: 18px; }
.scoreblock { position: relative; text-align: center; margin: 4px 0; }
.label { font-size: 12px; letter-spacing: 2px; color: var(--lavender); }
.combo { position: absolute; right: 4px; top: -10px; rotate: 8deg; background: var(--pink); font-family: var(--display); font-size: 16px; }
.bump { animation: bump .18s; } @keyframes bump { 50% { transform: scale(1.15); } }
.fever { display: flex; align-items: center; gap: 8px; padding: 0 4px; margin-bottom: 6px; }
.fever .segs { flex: 1; display: flex; gap: 3px; }
.fever .segs i { flex: 1; height: 14px; border: 2px solid #000; border-radius: 4px; background: var(--well); }
.fever .segs i.on { background: var(--cyan); } .fever.active .segs i.on { background: var(--yellow); }
.feverbanner { font-family: var(--display); font-size: 20px; letter-spacing: 2px; color: #000; background: var(--yellow); text-align: center; padding: 6px;
  border-radius: 12px; rotate: -1.5deg; margin-bottom: 8px; animation: pulse .5s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.04); } }
.toolbar { display: flex; gap: 10px; height: 68px; margin: 10px 0 5px; }
.toolbar > * { flex: 1; min-width: 0; font-size: 13px; }
.toolbar .ico { font-size: 20px; }
.panelchip { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #000; border: 3px solid #000; border-radius: 16px; box-shadow: 0 5px 0 #000; }

/* --- 結果画面 --- */
.overlay { position: absolute; inset: 0; z-index: 30; overflow-y: auto; }
.result { display: flex; flex-direction: column; gap: 16px; padding: 24px 20px; min-height: 100%; }
.statpanel { background: var(--panel); padding: 6px 16px; }
.statrow { display: flex; justify-content: space-between; align-items: center; height: 40px; border-bottom: 2px solid var(--divider); }
.statrow:last-child { border-bottom: 0; }
.statrow span:first-child { color: var(--lavender); font-size: 14px; }
.statrow span:last-child { font-family: var(--display); font-size: 20px; }
.rankbadge { position: relative; width: 140px; height: 140px; display: grid; place-items: center; flex: none; animation: rankIn .7s cubic-bezier(.3,1.5,.5,1) .2s both; }
.rankbadge svg { position: absolute; inset: 0; }
@keyframes rankIn { from { transform: scale(.1) rotate(-200deg); } }
.appear { animation: appear .5s cubic-bezier(.3,1.5,.5,1) both; } @keyframes appear { from { transform: scale(2.2); opacity: 0; } }
.boom { position: relative; height: 270px; flex: none; animation: appear2 .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes appear2 { from { transform: scale(.2); } }


/* --- シート・モーダル --- */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--base); border-top: 3px solid #000; border-radius: 28px 28px 0 0;
  box-shadow: 0 -6px 30px rgba(0,0,0,.5); display: flex; flex-direction: column; max-height: 88%; transition: height .25s; }
.sheet.half { height: 52%; } .sheet.full { height: 88%; }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.35); margin: 8px auto 0; cursor: pointer; }
.sheet .scroll { overflow-y: auto; flex: 1; padding: 0 16px 24px; }
.modalbg { position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 20px; }
.card { background: var(--base); border: 4px solid #000; border-radius: 24px; box-shadow: 0 8px 0 #000; padding: 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 2px solid var(--divider); font-size: 15px; }
.switch { width: 52px; height: 30px; border-radius: 99px; background: var(--well); border: 3px solid #000; position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--cyan); } .switch.on::after { left: 24px; }

/* --- 刺激モード --- */
.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stimhead { display: flex; align-items: center; gap: 10px; }
.stimcount { flex: 1; text-align: center; }
.badge { position: absolute; top: -9px; right: -9px; min-width: 22px; height: 22px; border-radius: 99px; background: var(--pink); color: #fff; border: 2px solid #000;
  font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
.festbar { margin-top: 6px; display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 12px; color: var(--lavender); height: 22px; }
.festbar.active { font-family: var(--display); font-size: 14px; color: #000; background: var(--yellow); border: 3px solid #000; border-radius: 10px; box-shadow: 0 3px 0 #000;
  height: 30px; justify-content: space-between; padding: 0 10px; animation: pulse .3s ease-in-out infinite alternate; }
.ticker { margin-top: 6px; height: 26px; display: flex; background: #000; border: 2px solid var(--yellow); border-radius: 6px; overflow: hidden; }
.ticker b { background: var(--pink); font-family: var(--display); font-weight: 400; font-size: 13px; padding: 0 8px; display: grid; place-items: center; flex: none; }
.ticker .track { flex: 1; overflow: hidden; position: relative; }
.ticker .track span { position: absolute; top: 3px; white-space: nowrap; color: var(--yellow); font-size: 13px; will-change: transform; }
.lastcell .boardwrap .board { transform: scale(1.04); transition: transform 1.2s ease-in-out; }
.boardwrap .board { transition: transform 1.2s ease-in-out; }
.notifs { position: absolute; left: 10px; right: 10px; top: 58px; z-index: 12; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.notif { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(42,26,94,.97); border: 3px solid #000; border-radius: 16px;
  box-shadow: 0 4px 0 rgba(0,0,0,.5); cursor: pointer; animation: slideDown .35s cubic-bezier(.3,1.4,.5,1); }
.notif .appico { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 17px; flex: none; }
.notif .msg { flex: 1; min-width: 0; } .notif .msg div:last-child { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes slideDown { from { transform: translateY(-80px); opacity: 0; } }
.superchats { position: absolute; right: 10px; bottom: 150px; z-index: 12; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.sc { pointer-events: auto; width: 210px; border: 3px solid #000; border-radius: 12px; overflow: hidden; color: #000; box-shadow: 3px 3px 0 rgba(0,0,0,.5); cursor: pointer;
  animation: slideLeft .4s cubic-bezier(.3,1.4,.5,1); }
.sc .top { display: flex; align-items: center; gap: 6px; padding: 6px 10px; }
.sc .bottom { padding: 5px 10px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes slideLeft { from { transform: translateX(240px); opacity: 0; } }
.bird { position: absolute; right: 8px; top: 40%; z-index: 13; display: flex; align-items: flex-end; gap: 4px; animation: slideLeft .45s cubic-bezier(.3,1.4,.5,1); }
.bird .bubble { background: #fff; color: #000; border: 3px solid #000; border-radius: 14px; padding: 10px; font-size: 14px; max-width: 190px; }
.widgets { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.stock { position: absolute; right: 8px; top: 118px; width: 112px; height: 58px; rotate: 3deg; background: rgba(0,0,0,.85); border: 2px solid var(--divider); border-radius: 8px; padding: 5px 6px; }
.runners { position: absolute; left: 8px; bottom: 84px; display: flex; flex-direction: column; gap: 8px; }
.runner { width: 140px; border: 3px solid #000; border-radius: 10px; overflow: hidden; box-shadow: 3px 3px 0 rgba(0,0,0,.5); }
.runner .live { display: flex; gap: 4px; align-items: center; background: #000; font-size: 9px; padding: 0 6px; height: 16px; }
.center-overlay { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none; }
.slotbox { background: var(--panel); border: 4px solid #000; border-radius: 20px; box-shadow: 0 6px 0 #000; padding: 14px; text-align: center; transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
.slotbox.win { background: var(--pink); transform: scale(1.1); }
.reels { display: flex; gap: 8px; margin-top: 8px; }
.reel { width: 58px; height: 64px; background: #fff; border: 3px solid #000; border-radius: 10px; display: grid; place-items: center; font-size: 34px; }
.toast { position: absolute; left: 12px; right: 12px; top: 54px; z-index: 25; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel);
  border: 3px solid #000; border-radius: 18px; box-shadow: 0 5px 0 #000; pointer-events: none; animation: slideDown .4s cubic-bezier(.3,1.4,.5,1); }
.tabs { display: flex; gap: 8px; padding: 0 16px 12px; }
.tabs .btn { flex: 1; min-height: 40px; --radius: 12px; --depth: 4px; font-size: 14px; }
.shoprow { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--panel); border: 3px solid #000; border-radius: 16px; box-shadow: 0 4px 0 #000; margin-bottom: 12px; }
.shoprow .icon { width: 46px; height: 46px; border-radius: 12px; border: 3px solid #000; display: grid; place-items: center; font-size: 22px; flex: none; }
.shoprow .info { flex: 1; min-width: 0; }
.shoprow .name { font-family: var(--display); font-size: 15px; }
.shoprow .detail { font-size: 11px; color: var(--lavender); }
.shoprow .buy { width: 86px; height: 50px; flex: none; --radius: 12px; --depth: 4px; font-size: 11px; }
.shoprow .buy b { font-family: var(--display); font-weight: 400; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.achv { padding: 10px; background: var(--panel); border: 3px solid #000; border-radius: 14px; box-shadow: 0 4px 0 #000; min-height: 110px; }
.achv.locked { opacity: .6; }
.achv .aicon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; background: var(--well); margin-bottom: 4px; }
.stats3 { display: flex; gap: 8px; }
.stats3 > div { flex: 1; text-align: center; padding: 8px 4px; background: var(--well); border: 3px solid #000; border-radius: 12px; box-shadow: 0 3px 0 #000; }
.stats3 small { display: block; font-size: 10px; color: var(--lavender); }
.stats3 b { font-family: var(--display); font-weight: 400; font-size: 14px; color: var(--yellow); }
.fishrow { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--panel); border: 3px solid #000; border-radius: 14px; box-shadow: 0 4px 0 #000; margin-bottom: 10px; }
.fishrow canvas { width: 60px; height: 44px; background: var(--well); border: 2px solid; border-radius: 10px; flex: none; }
.minibar { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--lavender); margin-top: 3px; }
.minibar span { width: 44px; } .minibar div { flex: 1; height: 6px; border-radius: 9px; background: var(--well); overflow: hidden; } .minibar i { display: block; height: 100%; border-radius: 9px; }
.dex { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.dex > div { height: 40px; border-radius: 8px; border: 2px solid #000; background: var(--well); display: grid; place-items: center; color: var(--lavender); }
.dex canvas { width: 100%; height: 100%; }
.iconbtn { background: none; border: 0; cursor: pointer; font-size: 16px; padding: 2px; }
.menu { position: absolute; z-index: 60; background: var(--panel); border: 3px solid #000; border-radius: 12px; box-shadow: 0 4px 0 #000; overflow: hidden; }
.menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; background: none; border: 0; border-bottom: 2px solid var(--divider); cursor: pointer; font-size: 14px; }
.menu button.danger { color: var(--pink); }
.ad { position: absolute; inset: 0; z-index: 55; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.skip { position: absolute; top: 60px; right: 16px; transition: transform .25s cubic-bezier(.3,1.5,.5,1); }
.progress { width: 80%; height: 8px; background: rgba(255,255,255,.25); border-radius: 9px; overflow: hidden; position: absolute; bottom: 40px; }
.progress i { display: block; height: 100%; background: var(--yellow); }
.daygrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.daygrid > div { min-height: 64px; border: 2.5px solid #000; border-radius: 10px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; gap: 2px; }
.daygrid .today { background: var(--yellow); color: #000; transform: scale(1.08); } .daygrid .past { background: var(--well); opacity: .6; }
.vignette { position: absolute; inset: 0; pointer-events: none; z-index: 7; animation: beat .75s infinite; background: radial-gradient(circle, transparent 140px, rgba(255,46,136,.45) 520px); }

@media (prefers-reduced-motion: reduce) { .logo svg, .lucky, .festbar.active, .feverbanner, .breathe { animation: none !important; } }

.nodela .shoprow .name, .nodela .cell, .nodela .shoprow .buy b, .nodela .stats3 b, .nodela .festbar.active, .nodela .ticker b, .nodela .feverbanner { font-weight: 900; }

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// ===== 基本 =====
const C = {
  base: '#1B0F3B', panel: '#2A1A5E', well: '#120A2A', boardBG: '#0B0620', divider: '#4A3690',
  tile: '#6B4BFF', tileDark: '#3B22B8', tileLight: '#9C85FF', fresh: '#3A1050',
  yellow: '#FFE600', pink: '#FF2E88', pinkSoft: '#FF4FA0', cyan: '#2EE6FF', lime: '#7CFF4F',
  orange: '#FF8A1F', lavender: '#C9BEFF', feverBG: '#3A0A3E', gameOverBG: '#2B0A1E'
};
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') {
        for (const [sk, sv] of Object.entries(v)) {
          if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv;
        }
      }
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtInt = n => Math.round(n).toLocaleString('ja-JP');
const compact = new Intl.NumberFormat('ja-JP', { notation: 'compact', maximumSignificantDigits: 3 });
function stimText(v) {
  if (v < 1000) return (v < 10 && v !== Math.round(v)) ? v.toFixed(1) : Math.floor(v).toLocaleString('ja-JP');
  return compact.format(v);
}
function dayString(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function formatTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${String(m).padStart(2, '0')}:${s.toFixed(1).padStart(4, '0')}`;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('dopagaki.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dopagaki.' + k, JSON.stringify(v)); } catch (e) { /* 保存できない環境 */ } },
  del(k) { try { localStorage.removeItem('dopagaki.' + k); } catch (e) { /* noop */ } }
};

// ===== 図形 =====
function starburstPath(points, size, inner = 0.72) {
  const c = size / 2, outer = size / 2 - 3;
  let d = '';
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outer : outer * inner;
    const a = i * Math.PI / points - Math.PI / 2;
    d += (i ? 'L' : 'M') + (c + Math.cos(a) * r).toFixed(1) + ' ' + (c + Math.sin(a) * r).toFixed(1);
  }
  return d + 'Z';
}
function starburstSVG(size, fill, points = 12, extra = '') {
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" ${extra}><path d="${starburstPath(points, size)}" fill="${fill}" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg>`;
}
function mineSVG(color = '#000') {
  let rays = '';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    rays += `<line x1="${50 + Math.cos(a) * 25}" y1="${50 + Math.sin(a) * 25}" x2="${50 + Math.cos(a) * 48}" y2="${50 + Math.sin(a) * 48}"/>`;
  }
  return `<svg class="mineicon" viewBox="0 0 100 100"><g stroke="${color}" stroke-width="10" stroke-linecap="round">${rays}</g><circle cx="50" cy="50" r="28" fill="${color}"/></svg>`;
}
function popHTML(text, size, color = C.yellow, shadows = ['#000'], step = 4, stroke = 2) {
  const sh = shadows.map((c, i) => `${step * (i + 1)}px ${step * (i + 1)}px 0 ${c}`).join(',') || 'none';
  return `<span class="pop" style="font-size:${size}px;color:${color};-webkit-text-stroke:${stroke}px #000;text-shadow:${sh}">${esc(text)}</span>`;
}

// ===== 振動・声 =====
const Haptics = {
  enabled: true,
  buzz(ms) { if (this.enabled && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* noop */ } } },
  light() { this.buzz(8); }, medium() { this.buzz(15); }, heavy() { this.buzz(30); },
  success() { this.buzz([12, 40, 18]); }, error() { this.buzz([40, 30, 60]); }, warning() { this.buzz([20, 40, 20]); }
};
const Voice = {
  say(text) {
    if (!Sound.enabled || !window.speechSynthesis || speechSynthesis.speaking) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 1.4; u.pitch = 1.6;
    try { speechSynthesis.speak(u); } catch (e) { /* noop */ }
  },
  stop() { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { /* noop */ } }
};

// ===== 効果音（その場で合成） =====
const Sound = {
  ctx: null, master: null, enabled: true, cache: new Map(), loopBuffers: new Map(), wanted: new Set(), playing: new Map(),
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
  },
  unlock() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().then(() => this.refreshLoops());
    else this.refreshLoops();
  },
  setEnabled(v) { this.enabled = v; this.refreshLoops(); },
  ready() { return this.enabled && this.ctx && this.ctx.state === 'running'; },
  makeBuffer(dur, fn) {
    const sr = this.ctx.sampleRate, n = Math.floor(dur * sr);
    const b = this.ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = fn(i / sr);
    return b;
  },
  env: (t, decay) => Math.min(1, t / 0.004) * Math.exp(-t * decay),
  tone(freq, dur, wave, decay) {
    const key = `${wave}-${freq | 0}-${dur}-${decay}`;
    if (this.cache.has(key)) return this.cache.get(key);
    const b = this.makeBuffer(dur, t => {
      const ph = 2 * Math.PI * freq * t;
      const s = wave === 'sine' ? Math.sin(ph) : wave === 'square' ? (Math.sin(ph) >= 0 ? 0.5 : -0.5) : 2 / Math.PI * Math.asin(Math.sin(ph));
      return s * this.env(t, decay) * 0.35;
    });
    this.cache.set(key, b);
    return b;
  },
  noise(dur, decay) {
    const key = `noise-${dur}-${decay}`;
    if (this.cache.has(key)) return this.cache.get(key);
    let f = 0;
    const b = this.makeBuffer(dur, t => {
      f += 0.18 * (Math.random() * 2 - 1 - f);
      const thump = Math.sin(2 * Math.PI * 55 * t) * Math.exp(-t * 7);
      return (f * 1.6 + thump * 0.8) * this.env(t, decay) * 0.5;
    });
    this.cache.set(key, b);
    return b;
  },
  schedule(buffers) {
    let t = this.ctx.currentTime;
    for (const b of buffers) {
      const src = this.ctx.createBufferSource();
      src.buffer = b; src.connect(this.master); src.start(t);
      t += b.duration;
    }
  },
  play(name, step = 0) {
    if (!this.ready()) return;
    const T = (f, d, w, k) => this.tone(f, d, w, k);
    switch (name) {
      case 'open': this.schedule([T(523.25 * Math.pow(2, Math.min(Math.max(step - 1, 0), 24) / 12), 0.09, 'square', 28)]); break;
      case 'flag': this.schedule([T(330, 0.08, 'triangle', 30)]); break;
      case 'button': this.schedule([T(880, 0.05, 'triangle', 40)]); break;
      case 'radar': this.schedule([T(1200, 0.07, 'sine', 25), T(1600, 0.1, 'sine', 25)]); break;
      case 'explosion': this.schedule([this.noise(0.8, 5)]); break;
      case 'fanfare': this.schedule([523.25, 659.25, 783.99].map(f => T(f, 0.1, 'square', 14)).concat([T(1046.5, 0.45, 'square', 5)])); break;
      case 'fever': this.schedule([659.25, 783.99, 987.77, 1318.5, 1568].map(f => T(f, 0.06, 'square', 18))); break;
      case 'revive': this.schedule([392, 523.25, 659.25].map(f => T(f, 0.1, 'triangle', 12))); break;
      case 'bounce': this.schedule([T(1400, 0.035, 'sine', 70)]); break;
      case 'buy': this.schedule([783.99, 1046.5, 1568].map(f => T(f, 0.07, 'triangle', 20))); break;
      case 'cash': this.schedule([T(1318.5, 0.05, 'square', 30), T(1760, 0.14, 'square', 18)]); break;
      case 'notify': this.schedule([T(880, 0.08, 'sine', 20), T(1318.5, 0.12, 'sine', 16)]); break;
      case 'gacha': this.schedule([523.25, 659.25, 783.99, 1046.5].map(f => T(f, 0.05, 'square', 25))); break;
      case 'ssr': this.schedule([523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].map(f => T(f, 0.05, 'square', 20)).concat([T(2093, 0.5, 'square', 5)])); break;
      case 'cry': this.schedule([659.25, 587.33, 493.88].map(f => T(f, 0.16, 'triangle', 9))); break;
      case 'crack': this.schedule([this.noise(0.18, 22), T(2600, 0.04, 'square', 60)]); break;
      case 'slotStop': this.schedule([T(220, 0.06, 'square', 35)]); break;
    }
  },
  // --- 環境音ループ ---
  setLoop(name, on) { if (on) this.wanted.add(name); else this.wanted.delete(name); this.refreshLoops(); },
  stopAllLoops() { this.wanted.clear(); this.refreshLoops(); },
  refreshLoops() {
    for (const name of ['lofi', 'lofiPlus', 'rain', 'heartbeat']) {
      const want = this.ready() && this.wanted.has(name);
      const cur = this.playing.get(name);
      if (want && !cur) {
        const src = this.ctx.createBufferSource();
        src.buffer = this.loopBuffer(name); src.loop = true;
        const g = this.ctx.createGain();
        g.gain.value = name === 'rain' ? 0.4 : name === 'heartbeat' ? 0.9 : 0.55;
        src.connect(g); g.connect(this.master); src.start();
        this.playing.set(name, src);
      } else if (!want && cur) {
        try { cur.stop(); } catch (e) { /* noop */ }
        this.playing.delete(name);
      }
    }
  },
  loopBuffer(name) {
    if (!this.loopBuffers.has(name)) {
      const b = name === 'lofi' ? this.makeLofi(false) : name === 'lofiPlus' ? this.makeLofi(true)
        : name === 'rain' ? this.makeRain() : this.makeHeartbeat();
      this.loopBuffers.set(name, b);
    }
    return this.loopBuffers.get(name);
  },
  makeLofi(extra) {
    const beat = 60 / 72, bar = beat * 4;
    const chords = [[174.61, 220, 261.63, 329.63], [164.81, 196, 246.94, 293.66], [146.83, 174.61, 220, 261.63], [130.81, 164.81, 196, 246.94]];
    let lp = 0, nlp = 0;
    return this.makeBuffer(bar * 4, t => {
      const bi = Math.min(3, Math.floor(t / bar)), tb = t - bi * bar;
      const wob = 1 + 0.004 * Math.sin(2 * Math.PI * 0.4 * t);
      let pad = 0;
      for (const f of chords[bi]) pad += Math.sin(2 * Math.PI * f * wob * t) + 0.3 * Math.sin(2 * Math.PI * f * 2 * t);
      pad *= 0.05 * Math.min(1, tb / 0.25) * (0.6 + 0.4 * Math.exp(-tb * 0.8));
      const tBeat = t % beat, beatIndex = Math.floor(t / beat) % 4;
      let drums = 0;
      if (beatIndex === 0 || beatIndex === 2) drums += Math.sin(2 * Math.PI * (50 + 60 * Math.exp(-tBeat * 25)) * tBeat) * Math.exp(-tBeat * 8) * 0.6;
      const n = Math.random() * 2 - 1;
      nlp += 0.35 * (n - nlp);
      if (beatIndex === 1 || beatIndex === 3) drums += nlp * Math.exp(-tBeat * 16) * 0.35;
      drums += (n - nlp) * Math.exp(-(t % (beat / 2)) * 70) * 0.07;
      const crackle = Math.random() < 0.0004 ? rand(-0.3, 0.3) : 0;
      let lead = 0;
      if (extra) {
        lead += Math.sin(2 * Math.PI * chords[bi][0] / 2 * t) * 0.12 * (0.5 + 0.5 * Math.exp(-tBeat * 3));
        const eighth = beat / 2, step = Math.floor(t / eighth), notes = chords[bi];
        const f = notes[(step * 3 + bi) % notes.length] * 2, te = t % eighth;
        lead += (Math.sin(2 * Math.PI * f * te) > 0 ? 0.05 : -0.05) * Math.exp(-te * 9);
      }
      lp += 0.25 * (pad + drums + lead - lp);
      return lp + crackle + nlp * 0.01;
    });
  },
  makeRain() {
    let a = 0, b = 0, dripT = 1, dripF = 2000;
    const sr = this.ctx.sampleRate;
    return this.makeBuffer(6, () => {
      const n = Math.random() * 2 - 1;
      a += 0.08 * (n - a); b += 0.5 * (n - b);
      dripT += 1 / sr;
      if (Math.random() < 0.00012) { dripT = 0; dripF = rand(1500, 3200); }
      return a * 0.9 + (n - b) * 0.08 + Math.sin(2 * Math.PI * dripF * dripT) * Math.exp(-dripT * 60) * 0.15;
    });
  },
  makeHeartbeat() {
    return this.makeBuffer(0.75, t => {
      let s = 0;
      for (const [start, amp] of [[0, 1], [0.2, 0.7]]) {
        if (t >= start) { const d = t - start; s += Math.sin(2 * Math.PI * (48 + 30 * Math.exp(-d * 30)) * d) * Math.exp(-d * 18) * amp; }
      }
      return s * 0.8;
    });
  }
};

// ===== プレイヤー情報（通常モード） =====
const Progress = {
  xp: 0, level: 1, coins: 0, bestScore: 0, streak: 0, stage: 1, lastPlayDay: '',
  soundOn: true, hapticsOn: true, shakeOn: true, difficulty: 'easy',
  load() { Object.assign(this, store.get('progress', {})); this.apply(); },
  save() {
    const { xp, level, coins, bestScore, streak, stage, lastPlayDay, soundOn, hapticsOn, shakeOn, difficulty } = this;
    store.set('progress', { xp, level, coins, bestScore, streak, stage, lastPlayDay, soundOn, hapticsOn, shakeOn, difficulty });
    this.apply();
  },
  apply() { Sound.setEnabled(this.soundOn); Haptics.enabled = this.hapticsOn; },
  xpNeeded(level) { return 300 + level * 100; },
  get xpToNext() { return this.xpNeeded(this.level) - this.xp; },
  get levelProgress() { return this.xp / this.xpNeeded(this.level); },
  addXP(a) { this.xp += a; while (this.xp >= this.xpNeeded(this.level)) { this.xp -= this.xpNeeded(this.level); this.level++; } this.save(); },
  recordScore(s) { this.bestScore = Math.max(this.bestScore, s); this.save(); },
  markPlayedToday() {
    const now = new Date(), today = dayString(now);
    if (this.lastPlayDay === today) return;
    const y = new Date(now); y.setDate(y.getDate() - 1);
    this.streak = this.lastPlayDay === dayString(y) ? this.streak + 1 : 1;
    this.lastPlayDay = today;
    this.save();
  }
};

// ===== 盤面 =====
const DIFFICULTY = {
  easy: { label: 'かんたん', color: C.cyan, rows: 9, cols: 9, mines: 10 },
  normal: { label: 'ふつう', color: C.pink, rows: 11, cols: 9, mines: 17 },
  hard: { label: 'ガチ', color: C.lime, rows: 13, cols: 9, mines: 26 }
};

class Board {
  constructor(rows, cols, mines) {
    this.rows = rows; this.cols = cols; this.mineCount = mines; this.minesPlaced = false;
    this.cells = Array.from({ length: rows * cols }, (_, id) => ({ id, isMine: false, adjacent: 0, isOpen: false, isFlagged: false }));
  }
  static of(diffKey) { const d = DIFFICULTY[diffKey]; return new Board(d.rows, d.cols, d.mines); }
  row(i) { return Math.floor(i / this.cols); }
  col(i) { return i % this.cols; }
  neighbors(i) {
    const r = this.row(i), c = this.col(i), out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) out.push(nr * this.cols + nc);
    }
    return out;
  }
  placeMines(first) {
    const forbidden = new Set([first, ...this.neighbors(first)]);
    const cand = this.cells.map(c => c.id).filter(i => !forbidden.has(i));
    for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
    for (const i of cand.slice(0, this.mineCount)) this.cells[i].isMine = true;
    for (const c of this.cells) c.adjacent = this.neighbors(c.id).filter(n => this.cells[n].isMine).length;
    this.minesPlaced = true;
  }
  open(start) {
    const s = this.cells[start];
    if (s.isOpen || s.isFlagged) return [];
    const result = [], queue = [{ index: start, depth: 0 }];
    s.isOpen = true;
    for (let head = 0; head < queue.length; head++) {
      const cur = queue[head];
      result.push(cur);
      const cell = this.cells[cur.index];
      if (cell.isMine || cell.adjacent !== 0) continue;
      for (const n of this.neighbors(cur.index)) {
        const nc = this.cells[n];
        if (!nc.isOpen && !nc.isFlagged && !nc.isMine) { nc.isOpen = true; queue.push({ index: n, depth: cur.depth + 1 }); }
      }
    }
    return result;
  }
  close(i) { this.cells[i].isOpen = false; }
  toggleFlag(i) { const c = this.cells[i]; if (c.isOpen) return false; c.isFlagged = !c.isFlagged; return true; }
  setFlag(i, v) { const c = this.cells[i]; if (!c.isOpen) c.isFlagged = v; }
  get flagCount() { return this.cells.filter(c => c.isFlagged).length; }
  get safeTotal() { return this.cells.length - this.mineCount; }
  get safeRemaining() { return this.cells.filter(c => !c.isMine && !c.isOpen).length; }
  chordTargets(i) {
    const cell = this.cells[i];
    if (!cell.isOpen || cell.isMine || cell.adjacent === 0) return [];
    const ns = this.neighbors(i);
    if (ns.filter(n => this.cells[n].isFlagged).length !== cell.adjacent) return [];
    return ns.filter(n => !this.cells[n].isOpen && !this.cells[n].isFlagged);
  }
}

// ===== 盤面の表示（通常・刺激で共通） =====
// game には board, freshDepth(Map), explodedIndex, revealMines, radarPing, luckyCells(Set), slotCells(Set), tap(i), longPress(i) が必要
class BoardView {
  constructor(game) {
    this.game = game;
    this.el = h('div', { class: 'board', role: 'grid' });
    this.wrap = h('div', { class: 'boardwrap' }, this.el);
    this.cache = [];
    this.cellEls = [];
    this.bindInput();
    this.ro = new ResizeObserver(() => this.layout());
    this.ro.observe(this.wrap);
  }
  setGame(game) { this.game = game; this.cache = []; this.render(); }
  build() {
    const b = this.game.board;
    this.el.innerHTML = '';
    this.el.style.gridTemplateColumns = `repeat(${b.cols}, var(--cell))`;
    this.cellEls = b.cells.map(c => {
      const e = h('div', { class: 'cell closed', 'data-i': c.id, role: 'gridcell', tabindex: '-1' });
      this.el.append(e);
      return e;
    });
    this.cache = [];
    this.builtFor = b;
    this.layout();
  }
  layout() {
    const b = this.game.board;
    const W = this.wrap.clientWidth, H = this.wrap.clientHeight;
    if (!W || !H) return;
    const gap = 4, pad = 8 + 4;
    const size = Math.floor(Math.min((W - pad * 2 - gap * (b.cols - 1)) / b.cols, (H - pad * 2 - 8 - gap * (b.rows - 1)) / b.rows));

  bindInput() {

    const idxOf = e => { const t = e.target.closest('.cell'); return t ? Number(t.dataset.i) : -1; };
    this.el.addEventListener('pointerdown', e => {
      Sound.unlock();
      lastType = e.pointerType;

    });

  popup(text, kind, row, col) {
    const b = this.game.board;

    if (!cell) return;
    const x = cell.offsetLeft + cell.offsetWidth / 2, y = cell.offsetTop + cell.offsetHeight / 2;
    const inner = kind === 'score' || kind === 'fever' ? esc(text) : `<span class="sticker">${esc(text)}</span>`;
    const p = h('div', { class: 'popup ' + kind, html: inner, style: { left: x + 'px', top: y + 'px' } });
    this.el.append(p);
    setTimeout(() => p.remove(), 1150);
  }
}

// ===== 紙吹雪 =====
function confettiCanvas() {
  const cv = h('canvas', { class: 'fx', style: { zIndex: 1 } });
  if (reduceMotion) return cv;
  const colors = [C.yellow, C.pink, C.cyan, C.lime, C.orange];
  const pieces = Array.from({ length: 70 }, () => ({
    x: Math.random(), speed: rand(140, 320), size: rand(8, 16), color: pick(colors), spin: rand(-8, 8), phase: rand(0, 6.28), delay: rand(0, 1.2)
  }));
  const start = performance.now();
  const frame = now => {
    if (!cv.isConnected) { if (now - start < 500) requestAnimationFrame(frame); return; }
    const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const t = (now - start) / 1000;
    for (const p of pieces) {
      if (t < p.delay) continue;
      const y = ((t - p.delay) * p.speed) % (H + 60) - 30;
      const x = p.x * W + Math.sin(t * 2 + p.phase) * 24;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * p.spin);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  return cv;
}

// ===== 通常モード =====
class NormalGame {
  constructor(diffKey, onExit) {
    this.diffKey = diffKey;
    this.diff = DIFFICULTY[diffKey];
    this.onExit = onExit;
    this.view = new BoardView(this);
    this.buildDOM();
    this.restart(true);
    this.raf = requestAnimationFrame(this.loop = () => { this.updateTimer(); this.raf = requestAnimationFrame(this.loop); });
  }
  get par() { return this.diff.mines * 4; }
  get isActive() { return this.phase === 'ready' || this.phase === 'playing'; }
  get multiplier() { return (1 + this.combo * 0.1) * (this.isFever ? 2 : 1); }
  get minesLeft() { return this.board.mineCount - this.board.flagCount; }
  elapsed() { return this.startTime ? ((this.endTime || performance.now()) - this.startTime) / 1000 : 0; }

  restart(first = false) {
    if (!first) this.commitPending();
    clearTimeout(this.feverTimer); clearInterval(this.feverTick);
    this.board = Board.of(this.diffKey);
    this.stage = Progress.stage;
    this.phase = 'ready'; this.flagMode = false;
    this.score = 0; this.combo = 0; this.maxCombo = 0; this.feverGauge = 0; this.isFever = false; this.feverCount = 0;
    this.biggestChain = 0; this.startTime = 0; this.endTime = 0; this.radarLeft = 2; this.reviveLeft = 1;
    this.freshDepth = new Map(); this.explodedIndex = null; this.revealMines = false; this.radarPing = null;
    this.result = null; this.committed = false; this.comboToken = 0; this.freshToken = 0;
    this.resultEl.innerHTML = '';
    Progress.markPlayedToday();
    this.update();
  }

  // --- 入力 ---
  tap(i) {
    if (!this.isActive) return;
    const cell = this.board.cells[i];
    if (this.flagMode && !cell.isOpen) return this.toggleFlag(i);
    if (cell.isFlagged) return Haptics.light();
    if (cell.isOpen) return this.chord(i);
    if (this.phase === 'ready') { this.board.placeMines(i); this.phase = 'playing'; this.startTime = performance.now(); }
    this.reveal([i], i);
  }
  longPress(i) {
    if (!this.isActive) return;
    if (this.board.cells[i].isOpen) this.chord(i); else this.toggleFlag(i);
  }
  toggleFlagMode() { this.flagMode = !this.flagMode; Haptics.light(); Sound.play('button'); this.update(); }
  toggleFlag(i) { if (this.board.toggleFlag(i)) { Haptics.medium(); Sound.play('flag'); this.update(); } }
  chord(i) {
    const t = this.board.chordTargets(i);
    if (!t.length) return Haptics.light();
    this.reveal(t, i);
  }
  useRadar() {
    if (this.phase !== 'playing' || this.radarLeft <= 0) return;
    const cand = this.board.cells.filter(c => c.isMine && !c.isFlagged).map(c => c.id);
    if (!cand.length) return;
    const target = pick(cand);
    this.radarLeft--;
    this.board.setFlag(target, true);
    this.radarPing = target;
    this.view.popup('レーダー!', 'info', this.board.row(target), this.board.col(target));
    Sound.play('radar'); Haptics.success();
    setTimeout(() => { if (this.radarPing === target) { this.radarPing = null; this.update(); } }, 1200);
    this.update();
  }
  reveal(targets, origin) {
    const mine = targets.find(t => this.board.cells[t].isMine && !this.board.cells[t].isFlagged);
    if (mine != null) return this.explode(mine);
    let opened = [];
    for (const t of targets) opened = opened.concat(this.board.open(t));
    if (!opened.length) return;
    this.registerOpen(opened, origin);
    if (this.board.safeRemaining === 0) this.win();
    this.update();
  }
  registerOpen(opened, origin) {
    this.combo++; this.maxCombo = Math.max(this.maxCombo, this.combo);
    const token = ++this.comboToken;
    setTimeout(() => { if (this.comboToken === token && this.phase === 'playing') { this.combo = 0; this.update(); } }, 2000);
    const count = opened.length;
    this.biggestChain = Math.max(this.biggestChain, count);
    let gained = count * 10 * this.multiplier;
    if (count >= 10) gained += count * 20;
    const points = Math.round(gained);
    this.score += points;
    this.freshDepth = new Map(opened.map(o => [o.index, o.depth]));
    const ft = ++this.freshToken;
    setTimeout(() => { if (this.freshToken === ft) { this.freshDepth = new Map(); this.update(); } }, 900);
    const r = this.board.row(origin), c = this.board.col(origin);
    this.update();
    this.view.popup('+' + fmtInt(points), 'score', r, c);
    if (count >= 10) this.view.popup(`CHAIN ${count}マス!`, 'chain', Math.min(r + 1, this.board.rows - 1), c);
    if (this.combo >= 5 && this.combo % 5 === 0) this.view.popup(`x${this.combo} COMBO!!`, 'combo', Math.max(r - 1, 0), c);
    if (!this.isFever) {
      this.feverGauge = Math.min(1, this.feverGauge + 0.05 + count * 0.015);
      if (this.feverGauge >= 1) this.startFever();
    }
    Sound.play('open', this.combo);
    if (count >= 10) Haptics.heavy(); else Haptics.light();
    if (count >= 15) shake(this.content);
    bump(this.scoreEl);
  }
  startFever() {
    this.isFever = true; this.feverCount++; this.feverGauge = 1;
    Sound.play('fever'); Haptics.success();
    this.view.popup('FEVER!!', 'fever', Math.floor(this.board.rows / 2), Math.floor(this.board.cols / 2));
    clearInterval(this.feverTick);
    this.feverTick = setInterval(() => {
      this.feverGauge = Math.max(0, this.feverGauge - 1 / 40);
      if (this.feverGauge <= 0) { clearInterval(this.feverTick); this.isFever = false; }
      this.update();

  }
  stopFever() { clearInterval(this.feverTick); this.isFever = false; }

  // --- 勝ち負け ---
  explode(i) {
    this.board.open(i);
    this.explodedIndex = i; this.phase = 'lost'; this.endTime = performance.now();
    this.stopFever();
    shake(this.content);
    Sound.play('explosion'); Haptics.error();
    this.update();
    setTimeout(() => { this.revealMines = true; this.update(); }, 250);
    setTimeout(() => { if (this.phase === 'lost') this.finishRound(false); }, 1100);
  }
  win() {
    this.phase = 'won'; this.endTime = performance.now();
    this.stopFever();
    for (const c of this.board.cells) if (c.isMine) this.board.setFlag(c.id, true);
    const t = this.elapsed();
    const bonus = Math.max(0, Math.floor((this.par * 2 - t) * 50));
    if (bonus > 0) {
      this.score += bonus;
      this.view.popup('TIME BONUS +' + fmtInt(bonus), 'chain', Math.floor(this.board.rows / 2), Math.floor(this.board.cols / 2));
    }
    Sound.play('fanfare'); Haptics.success();
    setTimeout(() => this.finishRound(true), 900);

  static rank(time, par, maxCombo) {

    if (ratio < 1.1) return 'A';
    if (ratio < 1.8) return 'B';

  finishRound(won) {

      rank: won ? NormalGame.rank(t, this.par, this.maxCombo) : '-',
      xpGained: won ? 200 + Math.floor(this.score / 50) : 20 + Math.floor(this.score / 200),
      coinsGained: won ? 50 + Math.floor(this.score / 100) : Math.floor(this.score / 400),
      levelFrom: Progress.level, levelTo: Progress.level, previousBest: Progress.bestScore,

function share(text) {
  const copy = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('スコアをコピーしました'), () => toast(text));
    else toast(text);
  };
  if (navigator.share) navigator.share({ text }).catch(e => { if (!e || e.name !== 'AbortError') copy(); });
  else copy();
}
function toast(text) {
  const t = h('div', { class: 'toast', style: { justifyContent: 'center', zIndex: 95 } }, text);
  document.getElementById('app').append(t);
  setTimeout(() => t.remove(), 2200);
}

const Fish = {
  stageIndex(f) {
    const g = RARITY[SPEC[f.species].rarity].growth;
    for (let k = 3; k > 0; k--) if (f.xp >= STAGES[k].xp * g) return k;
    return 0;
  },
  stage(f) { return STAGES[this.stageIndex(f)]; },
  progress(f) {
    const k = this.stageIndex(f), g = RARITY[SPEC[f.species].rarity].growth;
    if (k === 3) return 1;
    const lo = STAGES[k].xp * g, hi = STAGES[k + 1].xp * g;
    return (f.xp - lo) / (hi - lo);
  },
  name(f) {
    if (this.stageIndex(f) === 0) return RARITY[SPEC[f.species].rarity].label + 'の卵';
    return f.nickname || SPEC[f.species].name;
  },
  income(f) { return RARITY[SPEC[f.species].rarity].income * this.stage(f).income * (f.hunger > 0 ? 1 : 0.5); },
  randomRarity() {
    const keys = Object.keys(RARITY);
    let roll = Math.random() * keys.reduce((s, k) => s + RARITY[k].weight, 0);
    for (const k of keys) { if (roll < RARITY[k].weight) return k; roll -= RARITY[k].weight; }
    return 'n';
  },
  create(rarity, swimming) {
    const sp = pick(SPECIES.filter(s => s.rarity === rarity));
    return { id: Math.random().toString(36).slice(2) + Date.now().toString(36), species: sp.id, nickname: '', xp: 0, hunger: 1, swimming,

  }
};

class StimGame {

    this.showEnding = !!s.endingSeen && this.owns('detox');

    this.board = Board.of('easy');
    this.phase = 'ready'; this.flagMode = false;
    this.combo = 0; this.clearStreak = 0; this.freshDepth = new Map(); this.explodedIndex = null; this.revealMines = false;

    this.comboToken = 0; this.freshToken = 0; this.boardID = 0; this.lastVoice = 0; this.welcomeChecked = false;
    this.v = null; // 画面（StimView）
  }

  // ----- 数値 -----
  level(id) { return this.levels[id] || 0; }
  owns(id) { return this.level(id) > 0; }
  count(k) { return this.counters[k] || 0; }
  bump(k) { this.counters[k] = this.count(k) + 1; return this.counters[k]; }
  get cellValue() { return 1 + this.level('tapPower'); }
  get comboMultiplier() { return Math.min(3, 1 + this.combo * 0.1); }
  get streakMultiplier() { return Math.min(3, 1 + this.clearStreak * 0.25); }
  get prestigeMultiplier() { return 1 + 0.1 * this.prestigePoints; }
  get petMultiplier() {
    if (!this.owns('pet')) return 1;
    if (this.petHunger <= 0) return 0.7;
    if (this.petHunger > 0.6) return 1 + 0.15 * Math.min(this.level('pet'), 10);
    return 1;
  }
  get earnMultiplier() { return this.prestigeMultiplier * (this.festActive ? 2 : 1) * this.petMultiplier; }
  get fishPerSecond() { return this.fish.reduce((s, f) => s + Fish.income(f), 0); }
  get basePerSecond() {
    let total = 0;
    for (const it of ITEMS) if (it.id !== 'stocks') total += it.perSecond * this.level(it.id);
    if (this.owns('stocks')) total += ITEM.stocks.perSecond * this.level('stocks') * this.stockPrice / 100;
    total += this.fishPerSecond;
    return total * this.streakMultiplier;
  }
  get perSecond() { return this.basePerSecond * this.earnMultiplier; }
  get gachaCost() { return Math.round(500 * Math.pow(1.12, this.gachaRolls)); }
  get petFoodCost() { return Math.round(30 + this.basePerSecond * 8); }
  get isActive() { return this.phase === 'ready' || this.phase === 'playing'; }
  get minesLeft() { return this.board.mineCount - this.board.flagCount; }
  get prestigeGain() { const g = Math.floor(Math.sqrt(this.totalEarned / 20000)); return this.showEnding ? Math.max(1, g) : g; }
  get isBlocked() { return this.showEnding || !!this.adSession || !!this.loginBonus || !!this.offlineReward; }
  get birdCount() { return Math.min(Math.max(this.level('studyBird'), 1), 3); }

  start() {
    this.applyAmbience();
    if (!this.welcomeChecked) { this.welcomeChecked = true; this.checkWelcome(); }
